# Managed by `dotf converge --only workstation-target` (#2356). Edit the copy in
# the dotfiles checkout (ssh/sshd-workstation.conf); the next converge restores
# this file. 01- sorts first, and sshd keeps the first value it reads.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers {user}@{mesh}
AllowAgentForwarding no
X11Forwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
