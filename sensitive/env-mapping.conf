# Environment Variable Mapping
# Format: ENV_VAR_NAME=filename (without .secret.age extension)
#
# Usage:
#   1. Add secret:  echo "value" > sensitive/name.secret && age-encrypt-decrypt.sh encrypt
#   2. Map it:      echo "VAR_NAME=name" >> sensitive/env-mapping.conf
#   3. Load:        Restart terminal or run 'secrets_refresh'
#
# The loader will:
#   - Read this file
#   - Find sensitive/<filename>.secret.age
#   - Decrypt and export as ENV_VAR_NAME

# API Tokens
GITHUB_PERSONAL_ACCESS_TOKEN=github.token
DOCKERHUB_TOKEN=dockerhub.token
CLOUDFLARE_API_TOKEN=cloudflare.api-token
HETZNER_API_TOKEN=hetzner.api-key
OPENAI_API_KEY=chatgpt.api-key
STRIPE_API_KEY=stripe.api-key
YOUTUBE_API_KEY=youtube.api-key
BEEHIIV_API_KEY=beehiiv.api-key
