# versions.conf - Central version manifest
# Format: KEY=VALUE (no export, no quotes)
# Sourced by .zshrc/.bashrc; parsed by setup-windows.ps1, CI and dotf
#
# A "# mise: cli" line marks the pin on the NEXT line as a CLI that
# `dotf tools sync` installs through mise (ADR-044): NAME_VERSION becomes mise's
# `name` (underscores to hyphens), whose short name resolves to the aqua backend.
# A "# mise: python-package" line marks a library the Python that mise installs
# must carry: NAME_VERSION is the PyPI distribution `name`, installed at that pin
# into mise's Python (#2062). It needs PYTHON_VERSION under "# mise: cli".
# The marker sits on its own line because every reader skips comment lines but
# would read a trailing comment as part of the version.

JAVA_VERSION=21.0.4
MAVEN_VERSION=3.9.4
# Python is a hard dependency of the toolchain (#2062): the suite's TOML readers
# import tomllib (3.11+), and `dotf doctor` fails below that floor. 3.13.16, not
# 3.12.x: mise refuses python-build-standalone builds without GitHub artifact
# attestations, and 3.12.6 has none.
# mise: cli
PYTHON_VERSION=3.13.16
# PyYAML, which the suite imports to read workflow YAML.
# mise: python-package
PYYAML_VERSION=6.0.3
MINIKUBE_VERSION=1.34.0
GO_VERSION=1.26.10
# Node is installed before npm-backed CLIs on Windows and supplies npm for the
# catalog's npm tools on every OS. Keep one pinned runtime in the mise layer.
# mise: cli
NODE_VERSION=24.22.1
# mise: cli
BATS_VERSION=1.13.0
# AGE_VERSION / EZA_VERSION / ZOXIDE_VERSION pin deterministic release
# binaries across Windows CI, Linux CI, integration tests, setup, and doctor.
# mise: cli
AGE_VERSION=1.3.1
# eza is not marked: it has no aqua entry and no macOS release asset (F-056).
EZA_VERSION=0.23.4
# mise: cli
ZOXIDE_VERSION=0.9.9
# gh runs under `dotf pr`, `dotf forge` and the spec gates. Ubuntu's apt gh
# (2.46.0) lacks `gh pr checks --json`, so the pin is its floor (#2136). Windows
# still takes gh from setup-windows.ps1's winget row while mise is off there.
# mise: cli
GH_VERSION=2.102.0
# zsh-autosuggestions installs through mise's http backend (DX-005, #2654):
# its archive digest lives in fileTools (cli/internal/tools/mise_files.go),
# released in v0.73.0. A bump needs the new digest in a released dotf first.
# mise: cli
ZSH_AUTOSUGGESTIONS_VERSION=0.7.1
# The agents track their newest release (#2013 D9): mise renders them as
# `latest` and the sync upgrades them, so each value is a FLOOR, the version
# measured on the macmini on 2026-10-13. Raise it only to what aqua's registry
# serves (`mise latest <tool>`): agy there lags upstream by a patch (1.3.3 vs
# 1.3.4), and a floor above it fails doctor on every machine. Claude's own
# updater and pi's update notice are turned off in the mise config
# (RenderMiseConfig's [env]).
# mise: latest
CLAUDE_VERSION=2.1.296
# mise: latest
AGY_VERSION=1.3.3
# pi joined the agents under mise when aqua caught up with npm (1.2.0 on
# 2026-10-14). setup-windows.ps1 still installs it from npm at this floor, since
# Windows has no mise yet (#2013), and CI's pi reconcile installs exactly this
# version, so keep it at the version the machines run, or CI tests a pi nobody
# uses (BUG-104).
# mise: latest
PI_VERSION=1.2.0
# ShellCheck release assets are versioned (the `-stable` alias was retired after
# v0.10, so latest/download/shellcheck-stable... now 404s). Pin the tag; setup
# builds the URL + the tarball's internal dir name from it (prefixed with `v`).
# mise: cli
SHELLCHECK_VERSION=0.11.0
# golangci-lint gates the Go layer (ADR-020's primary layer), so it is pinned for
# the same reason shellcheck is: the CI job previously took the action's `latest`
# default, which meant a local run could not reproduce CI's verdict and a linter
# release could turn main red with no change here. Bump deliberately (BUG-071).
# mise: cli
GOLANGCI_LINT_VERSION=2.12.2
# PSSCRIPTANALYZER_VERSION is the PowerShell linter lint-powershell runs, its one
# owner (#2052). Pinned for the golangci-lint reason: a Gallery release must not
# change the verdict unbumped. A "# pwsh-module: <Name>" line marks a pin as a
# PowerShell Gallery module the pwsh-modules converge step installs at exactly
# that version wherever pwsh is on PATH, so `dotf lint powershell` reaches CI's
# verdict locally (PLAT-003). The marker carries the Gallery name.
# pwsh-module: PSScriptAnalyzer
PSSCRIPTANALYZER_VERSION=1.25.0
# Pinned CLIs that only mise installs (ADR-044). jq replaces setup-linux.sh's
# `releases/latest` linux-amd64 download, which had no pin at all (F-030).
# mise: cli
JQ_VERSION=1.8.2
# mise: cli
DIRENV_VERSION=2.37.1
# mise: cli
FZF_VERSION=0.74.4
# mise: cli
LAZYGIT_VERSION=0.66.0
# yazi: the file explorer herdr opens on demand (popup) and docked right
# (HERDR-001, `dotf herdr explorer`). mise, not brew, so the pin is the only
# provisioning step on every OS; its `--version` prints a Version line, so the
# sync's first x.y.z probe reads the pin without a versionArgs row.
# mise: cli
YAZI_VERSION=26.9.1
# uv through mise (aqua:astral-sh/uv) replaces setup-linux.sh's unpinned
# `curl | sh` installer. It also provides uvx (the uvx MCP servers) and runs the
# packages.json uv-tool entries. Windows keeps its installer until the Windows
# session measures `mise install uv` there.
# mise: cli
UV_VERSION=0.12.18
# herdr, the agent cockpit that replaces Orca on every OS (#2013 D6, H1). The
# rendered mise config aliases it to github:herdrdev/herdr on linux and macOS,
# which verifies the release digest AND upstream's GitHub artifact attestations;
# aqua's registry entry checks the digest only (#2013 H3, attestedBackend).
# mise: cli
HERDR_VERSION=0.9.3
# --- Toolset for the kubelab stack (#2013) ------------------------------------
# One group, apart from the pins above, so the pins of other changes to this
# file do not interleave with it. Each short name resolves to the aqua backend;
# the line above each pin says what aqua verifies. A tool whose `--version` is
# not its version needs a versionArgs row in a released dotf first
# (tests/versions-conf.bats).
# terraform: the sha256 checksums from releases.hashicorp.com.
# mise: cli
TERRAFORM_VERSION=1.16.4
# mkcert: no checksum or signature upstream; the release digest only.
# mise: cli
MKCERT_VERSION=1.4.4
# cloudflared: no checksum file upstream; the release digest only.
# mise: cli
CLOUDFLARED_VERSION=2026.9.3
# trivy: the checksums file, itself verified with cosign.
# mise: cli
TRIVY_VERSION=0.74.0
# kubectx and kubens: the sha256 checksums file.
# mise: cli
KUBECTX_VERSION=0.11.0
# mise: cli
KUBENS_VERSION=0.11.0
# stern: the sha256 checksums file.
# mise: cli
STERN_VERSION=1.34.0
# yq: the sha512 checksums file, itself verified with cosign.
# mise: cli
YQ_VERSION=4.53.6
# shfmt: the sha256 checksums file.
# mise: cli
SHFMT_VERSION=3.14.1
# tflint: the checksums file and GitHub artifact attestations.
# mise: cli
TFLINT_VERSION=0.64.0
# hadolint: the checksum and GitHub artifact attestations.
# mise: cli
HADOLINT_VERSION=2.15.1
# actionlint: the checksums file and GitHub artifact attestations.
# mise: cli
ACTIONLINT_VERSION=1.7.12
# delta, fd and bat: no checksum file upstream; the release digest only.
# mise: cli
DELTA_VERSION=0.19.2
# mise: cli
FD_VERSION=10.5.0
# mise: cli
BAT_VERSION=0.26.1
# The kubelab CLIs (#2013 P5b). None answers `--version` with its version;
# dotf asks each the way versionArgs in cli/internal/tools/mise.go names, which
# every release since 0.67.0 carries (tests/versions-conf.bats). kubectl stays
# within one minor of kubelab's k3s (v1.34.4) and helm on its 3.x line.
# kubectl and helm: the sha256 file published beside each binary.
# mise: cli
KUBECTL_VERSION=1.35.8
# mise: cli
HELM_VERSION=3.21.4
# argocd, kustomize, hcloud, k9s and kubeconform: the release digest only (aqua
# names no signer for argocd's SLSA provenance, so mise skips it).
# mise: cli
ARGOCD_VERSION=3.5.3
# mise: cli
KUSTOMIZE_VERSION=5.8.1
# mise: cli
HCLOUD_VERSION=1.69.0
# mise: cli
K9S_VERSION=0.51.0
# mise: cli
KUBECONFORM_VERSION=0.8.0
# --- end of the toolset group -------------------------------------------------
# GIT_VERSION is a floor read by `dotf doctor` only; no installer provisions git
# (it comes from the OS package manager). git-for-windows below 2.55 could not
# execute hooks through a C:/-form core.hooksPath, so the GUARD hooks aborted
# every commit; 2.55.0 is the first version measured working (#912, lesson 239).
GIT_VERSION=2.55.0
# PESTER_VERSION is the test runner test-windows installs and caches (#1605);
# the pwsh-modules converge step installs the same version locally (PLAT-003).
# pwsh-module: Pester
PESTER_VERSION=6.2.0
# x-release-please-start-version
DOTF_VERSION=0.79.0
# x-release-please-end
