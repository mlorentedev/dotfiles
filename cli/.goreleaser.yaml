# goreleaser config for the dotf CLI (nested Go module, run from cli/).
# Release: push a plain tag vX.Y.Z — the CLI is the repo's only released
# artifact. monorepo.tag_prefix (cli/v*) is GoReleaser Pro-only; revisit the
# tag scheme if the repo ever needs releases of its own.
# Snapshot (every PR touching cli/**): goreleaser build --snapshot --clean
version: 2

project_name: dotf

builds:
  - id: dotf
    main: ./cmd/dotf
    binary: dotf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # main.commit is what makes provenance answerable. Between two releases the
    # version string is CONSTANT while the source moves every merge, so
    # version-equality is structurally blind for the one tool that IS this
    # repository (#1158). FullCommit, not ShortCommit: the doctor check feeds it
    # to `git merge-base --is-ancestor`, and an abbreviated hash is ambiguous in
    # principle and unresolvable in a shallow clone.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}

archives:
  - id: dotf
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true
