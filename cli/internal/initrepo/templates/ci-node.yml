# CI scaffolded by `dotf init`. The Spec-Driven Development convention is
# documented in AGENTS.md; wire an enforced spec-gate when your project wants one.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
