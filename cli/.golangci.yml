# golangci-lint v2, pinned in versions.conf. Only what differs from the default
# ("standard") linter set lives here.
version: "2"

linters:
  enable:
    - gocyclo
    - forbidigo
  settings:
    forbidigo:
      # #2061. internal/doctor decides by the target OS through System.GOOS, the
      # seam that lets a test on one host run every OS branch. A direct
      # runtime.GOOS read ties the branch to the machine running the test. The
      # sites that ask about the host filesystem itself say so in a nolint.
      forbid:
        - pattern: ^runtime\.GOOS$
          msg: read System.GOOS, the target-OS seam, so tests can run every branch
    gocyclo:
      # HARNESS-150. The largest function in internal/cmd today is
      # newSpecReviewCmd at 22, so anything that grows past it fails lint. The
      # line only moves down, one extraction at a time.
      min-complexity: 22
  exclusions:
    rules:
      # Scoped to internal/cmd, where the command closures grow. Other packages
      # hold older outliers, up to 32, that this change does not take on.
      - path-except: internal/cmd/
        linters:
          - gocyclo
      - path-except: internal/doctor/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo

# #1154. v2 moved formatting out of `linters:`, so a config without this block
# checks no formatting at all: four unformatted files sat on main behind a
# green lint.
formatters:
  enable:
    - gofmt
