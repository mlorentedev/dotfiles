# Aider global configuration
# Deployed to ~/.aider.conf.yml by setup scripts
# Docs: https://aider.chat/docs/config/aider_conf.html

# Default tier: DeepSeek V3.2 (70% aider polyglot, ~$0.40/month)
# OPENROUTER_API_KEY is exported by load-secrets.sh at shell startup
#
# 3 tiers available (budget ~$2/month):
#   daily (default):  aider
#   coding:           aider --model openrouter/qwen/qwen3-coder-next
#   architecture:     aider --architect --model openrouter/deepseek/deepseek-v3.2-speciale
model: openrouter/deepseek/deepseek-v3.2
editor-model: openrouter/deepseek/deepseek-v3.2

# UI
dark-mode: true
pretty: true
stream: true

# Git — we control commits ourselves
auto-commits: false
attribute-co-authored-by: false
git-commit-verify: true

# Linting
auto-lint: true

# Repo map budget (tokens)
map-tokens: 4096

# Updates
check-update: true
