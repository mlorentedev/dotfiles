# herdr's config (#2013 H4, D6). `dotf deploy herdr` MERGES these keys into
# the config.toml herdr also writes: onboarding saves `onboarding = false` and
# the Settings screen saves there too, and every key this file does not name
# stays the machine's. Validate a change with:
#   HERDR_CONFIG_PATH=ai/herdr/config.toml herdr config check

[keys]
# Not tmux's ctrl+b, so tmux keeps working inside a pane (owner, 2026-10-13).
# herdr puts the terminal in raw mode, so the tty's XOFF never sees ctrl+s.
prefix = "ctrl+s"
# Orca's tab keys (ai/orca/keybindings.json: Mod+Alt+[ and ]), as direct
# chords beside herdr's own prefix ones.
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]

# lazygit replaces Orca's diff viewer (H9): d for diff, a key herdr leaves
# unbound (prefix+g is goto). No alt chord, because macOS terminals send
# Option as Alt only when configured to. A popup opens in the focused pane's
# directory, so it shows that pane's worktree on every OS; mise installs
# lazygit at its versions.conf pin.
# The deploy entry matches bindings by key (listKeys), so an edited binding
# replaces its deployed copy.
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazygit"
description = "lazygit in this pane's repository"
width = "90%"
height = "90%"

# The worktree's files (HERDR-001), two ways over one tool. prefix+e is yazi in a
# popup over the focused pane, in its directory. prefix+shift+e is the same
# explorer docked as a split on the right: `dotf herdr explorer` toggles it, so
# pressing the key again closes it. Nothing here installs yazi -- YAZI_VERSION
# in versions.conf does, through `dotf tools sync`. The docked key runs the
# pinned dotf, so it needs a release that carries the subcommand and its toggle fix (0.77.0).
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "yazi"
description = "yazi over this pane: browse this worktree"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "dotf herdr explorer"
description = "yazi docked on the right of this pane (press again to close)"

[ui]
# Attention queue instead of grouping: an agent that is blocked or done floats to
# the top of the sidebar, which is the question this panel answers (who needs me
# now). Revert to grouping with agent_panel_sort = "spaces"; one key, no other
# setting depends on it.
agent_panel_sort = "priority"

[ui.sidebar.agents.rows_by_agent]
# pi's sidebar entry carries the session title on its own row, as Claude's does.
# pi 1.2.0 sets the terminal title itself (π - <session> - <cwd>, from
# interactive-mode.js updateTerminalTitle), which herdr reads as
# terminal_title; terminal_title_stripped drops one leading glyph. No pi
# extension is needed (#2646). The key is herdr's canonical agent id.
pi = [
    ["state_icon", "machine", "workspace", "tab"],
    ["terminal_title_stripped"],
    ["agent"],
]

[worktrees]
# herdr creates <directory>/<repo>/<branch-slug>; only the root is configurable.
# Beside the repos instead of herdr's default ~/.herdr/worktrees (owner,
# 2026-10-13), and not dot-prefixed: agy excludes **/.worktrees/** from a
# workspace. Copilot's trustedFolders trusts <directory>/*/*; agy's
# trustedWorkspaces trusts <directory> itself, because agy does not read the
# glob (#2533). All three render WORKTREE_ROOT, the root dotf worktree add
# uses (#2503).
directory = "{WORKTREE_ROOT}"

[update]
# mise installs herdr at the versions.conf pin, so herdr's own "new version"
# notice only invites a self-update that drifts from it (H3).
version_check = false

[experimental]
# Screen history persisted to session-history.json holds whatever the panes
# printed, secrets included. Off, as herdr's default is, and pinned so a
# Settings toggle shows as drift.
pane_history = false
