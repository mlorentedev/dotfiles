# tmux configuration
# Deployed to ~/.tmux.conf via setup-linux.sh symlink.
# Prefix: default C-b (preserves muscle memory across machines).

# Modern QoL
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# True color (works in alacritty/kitty/wezterm/gnome-terminal)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Copy mode: vi keys (matches nvim/vim)
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clipboard integration: 'y' and mouse-drag-end copy to system clipboard.
# Uses xclip (X11). For Wayland, swap to: wl-copy
bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'

# 1-based indexing -- easier to reach on keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane navigation with vim-style hjkl (prefix + key)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits inherit current pane's path (cd-state preserved)
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Minimal status bar -- session name left, clock right
set -g status-interval 60
set -g status-style "bg=default,fg=white"
set -g status-left "[#S] "
set -g status-left-length 30
set -g status-right "%H:%M"
set -g status-justify left
