# Starship Prompt Configuration
# https://starship.rs/config/

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Timeout for commands executed by starship (milliseconds)
command_timeout = 500

# ============================================================================
# Prompt Format
# ============================================================================
format = """
[╭─](bold green)$username$hostname$directory$git_branch$git_status$kubernetes$terraform$docker_context$python$nodejs$rust$golang
[╰─](bold green)$character"""

# ============================================================================
# Modules
# ============================================================================

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[←](bold green)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname](bold yellow) "
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
format = "in [$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " 🔒"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[kubernetes]
format = 'on [☸ $context( \($namespace\))](bold cyan) '
disabled = false
[kubernetes.context_aliases]
"dev.local.cluster.k8s" = "dev"
"gke_.*_(?P<cluster>[\\w-]+)" = "gke-$cluster"

[terraform]
format = "via [ $workspace]($style) "
style = "bold 105"
disabled = false

[docker_context]
format = "via [ $context](bold blue) "
disabled = false

[python]
symbol = " "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "yellow bold"
pyenv_version_name = false

[nodejs]
format = "via [ $version](bold green) "
disabled = false

[rust]
format = "via [ $version](red bold)"
disabled = false

[golang]
format = "via [ $version](bold cyan) "
disabled = false

[package]
disabled = true

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = "☁️  "
style = "bold yellow"
disabled = false
[aws.region_aliases]
us-east-1 = "use1"
us-west-2 = "usw2"
eu-west-1 = "euw1"

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
disabled = true

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[memory_usage]
disabled = true
threshold = 75
format = "via $symbol [${ram}( | ${swap})]($style) "
symbol = "🐏"
style = "bold dimmed white"
