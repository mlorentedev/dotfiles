# Threat model: agent-touched repo. CLAUDE.md / AGENTS.md / skill bodies may
# accidentally quote API keys, JWTs, or PEM blocks from chat. gitleaks blocks
# them before they reach git history.
#
# Setup (one-time):
#   cd ~/Projects/dotfiles && pre-commit install
#
# Bypass (only with explicit user approval):
#   SKIP=gitleaks git commit ...

# Pin the stage — see the same block in cli/internal/initrepo/templates/. Only
# `gitleaks` below declares no stage of its own, so this is what stops it running
# once per dispatched hook type (it was firing twice on every commit here). Its
# effective stage becomes pre-commit, which gates strictly earlier than pre-push:
# secrets are blocked before they enter history rather than before they leave the
# machine.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate message format
        entry: .github/hooks/validate-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: dotfiles-test
        name: Run dotfiles tests
        entry: ./scripts/test.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      # #925: scripts/test.sh (above) is a legacy smoke suite that never ran
      # bats and never ran this script. An em-dash in a new @test name
      # (bats silently drops such a test, CURATOR-001/#615) shipped past a
      # local commit ("dotfiles-test: Passed") and was only caught by a
      # fresh adversarial-review subagent running check-bats-names.sh
      # directly — a full review round burned on a one-character defect.
      - id: check-bats-names
        name: Check bats @test names (non-ASCII / duplicates)
        entry: ./scripts/check-bats-names.sh tests/
        language: script
        pass_filenames: false
        stages: [pre-commit]

      # BUG-088 (#1021): verify all repo paths referenced in backticks inside
      # agent instruction files resolve on disk.
      - id: check-doc-paths
        name: Check referenced doc paths in instruction files
        entry: ./scripts/check-doc-paths.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      # DOCS-020: the lessons' one format, numbers used once, wikilinks that
      # resolve, and no committed index (it is rendered by `dotf lessons index`,
      # CLI-131; --check names a committed one). Same command as CI's
      # repo-hygiene job, which runs it from the checkout; here it is the
      # installed dotf (DOTF_VERSION in versions.conf), so this hook checks only
      # what the pinned release does: the wikilink check reaches it with the
      # first release after 0.65.0, and until then only CI enforces it. A host
      # without dotf fails this hook rather than skipping it.
      - id: lessons-fmt
        name: Check docs/lessons format and that no index is committed
        entry: dotf lessons fmt --check --dir docs/lessons
        language: system
        pass_filenames: false
        files: ^docs/lessons/
        stages: [pre-commit]

      # PLAT-003 (#2678): CI's lint-powershell job, run locally by the installed
      # dotf (DOTF_VERSION). It analyzes the whole tree a commit would ship, so
      # it takes no filenames. That release exits 2 where pwsh is absent (a
      # Linux box without it), and the skip is this hook's policy, not the
      # command's, so it lives in the entry; with pwsh present, a finding (1)
      # and an analyzer missing at its pin (2) both fail the commit. Where pwsh
      # is present, a host without dotf fails this hook rather than skipping it,
      # as lessons-fmt does; without pwsh the hook skips before it reaches dotf.
      # A pwsh that is on PATH but cannot run (a mise shim with no version) is a
      # broken install, not an absent one: dotf reports it and the commit fails.
      - id: lint-powershell
        name: Lint PowerShell (dotf lint powershell, as CI's lint-powershell)
        entry: >-
          sh -c 'command -v pwsh >/dev/null 2>&1 || { echo "pwsh is not on PATH: skipping lint-powershell (CI runs it)"; exit 0; }; exec dotf lint powershell'
        language: system
        pass_filenames: false
        files: \.(ps1|psm1)$
        stages: [pre-commit]

      - id: sdd-spec-gate
        name: SDD spec-gate (Tier 4)
        # BUG-061: routed through the prepush adapter, not check-spec-gate.sh
        # directly -- the adapter resolves this branch's live PR (labels/body/
        # author) via `gh` when one exists, so archive-on-merge is credited
        # locally instead of only after push. Falls through to the gate with no
        # PR context (today's behaviour) when there is none yet.
        entry: ./scripts/spec-gate-prepush.sh
        args: ['--base-ref', 'origin/main', '--head-ref', 'HEAD']
        language: script
        pass_filenames: false
        stages: [pre-push]
        always_run: true
