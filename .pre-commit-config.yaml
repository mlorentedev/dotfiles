# Threat model: agent-touched repo. CLAUDE.md / AGENTS.md / skill bodies may
# accidentally quote API keys, JWTs, or PEM blocks from chat. gitleaks blocks
# them before they reach git history.
#
# Setup (one-time):
#   cd ~/Projects/dotfiles && pre-commit install
#
# Bypass (only with explicit user approval):
#   SKIP=gitleaks git commit ...

# Pin the stage — see the same block in cli/internal/initrepo/templates/. Only
# `gitleaks` below declares no stage of its own, so this is what stops it running
# once per dispatched hook type (it was firing twice on every commit here). Its
# effective stage becomes pre-commit, which gates strictly earlier than pre-push:
# secrets are blocked before they enter history rather than before they leave the
# machine.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate message format
        entry: .github/hooks/validate-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: dotfiles-test
        name: Run dotfiles tests
        entry: ./scripts/test.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      # #925: scripts/test.sh (above) is a legacy smoke suite that never ran
      # bats and never ran this script. An em-dash in a new @test name
      # (bats silently drops such a test, CURATOR-001/#615) shipped past a
      # local commit ("dotfiles-test: Passed") and was only caught by a
      # fresh adversarial-review subagent running check-bats-names.sh
      # directly — a full review round burned on a one-character defect.
      - id: check-bats-names
        name: Check bats @test names (non-ASCII / duplicates)
        entry: ./scripts/check-bats-names.sh tests/
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: sdd-spec-gate
        name: SDD spec-gate (Tier 4)
        entry: ./scripts/check-spec-gate.sh
        args: ['--base-ref', 'origin/main', '--head-ref', 'HEAD']
        language: script
        pass_filenames: false
        stages: [pre-push]
        always_run: true
