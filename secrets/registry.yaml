# secrets/registry.yaml — the mapping SSOT (ADR-028 §2 + the 2026-06-26 addendum).
#
# ONE entry per env var. The `id` IS the env var name — the stable consumer contract
# apps depend on. `dotf secrets {run,show,ls,set,migrate}` resolve by it.
#   - backend: age (current) | age-offline (floor) | bw (target, ADR-028 Phase 3).
#     `age:` is the base name under sensitive/ without the .secret.age suffix.
#   - `bw: {item, field}` is the Bitwarden target (model A1). The `item` GROUPS related
#     vars (the 7 X_* vars share `x-twitter-api`) and is a MUTABLE pointer — rename the
#     Bitwarden item and only this line changes; consumers depend on the env var, never
#     the item name. `field` is the named purpose (api-key, auth-token; notes for
#     multi-line; username/password for a login pair).
#   - `bw:` is declared up front but dormant while backend is age (validated once
#     flipped). `migrate <VAR>` writes the age value to the target, parity-checks, then
#     flips backend. floor secrets carry NO `bw:` (never live only in bw).
#
# This is the ONLY mapping SSOT. env-mapping.conf and the load-secrets twins were
# retired (#587/#601); a later housekeeping PR (#659) accidentally resurrected
# env-mapping.conf with no code path reading it — removed again, guarded, by #669.

version: 1
secrets:
  # ── apps: service API keys/tokens the projects consume ────────────────────

  # GitHub — one token per purpose (#321). The live tokens were fields of the legacy
  # 8-in-1 `GitHub` item; `dotf secrets reconcile` moved each into its own item and
  # retired the source field (CLI-080), so each lives in exactly one place.
  # GITHUB_PERSONAL_ACCESS_TOKEN was retired on 2026-09-23: no config, script or
  # MCP server read it, GitHub reported it never used, and it carried admin scopes
  # (admin:org, delete_repo, admin:enterprise) nothing here needs. The local gh CLI
  # authenticates with its own OAuth login. Declare a least-privilege token if a
  # consumer appears.
  - id: RELEASE_TOKEN
    plane: app
    backend: bw
    bw:
      item: github-release-pat
      field: RELEASE_TOKEN
      folder: Dotfiles/apps
    expose: { env: RELEASE_TOKEN }
    consumers: ["ci:mlorentedev/dotfiles"]
    rotate: 90d
    validate: github-token        # sync ci probes `gh api user` before upload (#635 follow-up)

  - id: BITACORA_PAT
    plane: app
    backend: bw
    # Split out of the `GitHub` item in June, before reconcile existed, and its
    # source field was never retired. By 2026-09-23 the two held DIFFERENT live
    # tokens, and CI repos held four between them. The newer one was rotated in
    # here, synced to every consumer below, and its GitHub/"bitacora token" source
    # retired by reconcile (from.retire, values compared in memory). A squash merge
    # drops the bw.from record from main's history; the PR that did it holds it.
    bw: { item: github-bitacora-pat, field: api-token, folder: Dotfiles/apps }
    expose: { env: BITACORA_PAT }
    # Every repository whose workflows read BITACORA_PAT (add-to-project,
    # bitacora-status), measured 2026-09-23 by reading each repo's workflow files:
    # code search found 7 of the 23. Only dotfiles was declared, so the others held
    # whichever token someone last pasted, several of which no longer existed.
    consumers:
      - ci:mlorentedev/boilerplates
      - ci:mlorentedev/cloud-architecture-coursework
      - ci:mlorentedev/dotfiles
      - ci:mlorentedev/embedded-systems-coursework
      - ci:mlorentedev/emva1288-sensor-characterization
      - ci:mlorentedev/garsync
      - ci:mlorentedev/hive
      - ci:mlorentedev/iris
      - ci:mlorentedev/kasa-provisioner
      - ci:mlorentedev/knowledge
      - ci:mlorentedev/kubelab
      - ci:mlorentedev/mail2markdown
      - ci:mlorentedev/mlorentedev
      - ci:mlorentedev/pdf-modifier-mcp
      - ci:mlorentedev/pollex
      - ci:mlorentedev/svqtriana.github.io
      - ci:mlorentedev/telecom-engineering
      - ci:mlorentedev/ts-bridge
      - ci:mlorentedev/vicon-fpga-face-detection
      - ci:mlorentedev/web
      - ci:mlorentedev/yt-metrics-cli
    rotate: 90d
    validate: github-token        # sync ci probes `gh api user` before upload (#635 follow-up)

  # DockerHub — one bw item: token→PAT (a scoped token), username→username.
  - id: DOCKERHUB_TOKEN
    plane: app
    backend: bw
    # PAT, not password: the item carries both, and the account password
    # authenticates against the Hub API exactly as the scoped token does — which is
    # why mapping the wrong one stayed invisible. Verified 2026-08-15: both return
    # HTTP 200, so this is a blast-radius fix, not a repair of a broken credential.
    bw: { item: dockerhub, field: PAT, folder: Dotfiles/apps }
    expose: { env: DOCKERHUB_TOKEN }
    consumers: ["ci:image-push"]
    rotate: 180d

  - id: DOCKERHUB_USERNAME            # identifier, not a rotating secret
    plane: app
    backend: bw
    bw: { item: dockerhub, field: username, folder: Dotfiles/apps }
    expose: { env: DOCKERHUB_USERNAME }
    consumers: ["ci:image-push"]

  - id: OPENAI_API_KEY               # naming drift: store says "chatgpt", service is OpenAI
    plane: app
    backend: bw
    bw: { item: openai-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: OPENAI_API_KEY }
    consumers: [local, "ci:yt-metrics"]
    rotate: 90d

  - id: OPENROUTER_API_KEY           # naming drift: double-dot .api.key
    plane: app
    backend: bw
    bw: { item: openrouter-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: OPENROUTER_API_KEY }
    consumers: ["agent:opencode"]
    rotate: 90d

  - id: NAN_API_KEY
    plane: app
    backend: bw
    bw: { item: nan-api-key, field: api-key, folder: Dotfiles/apps }
    # The legacy copy in cloud.nan.builders/api-key was verified equal and retired
    # through bw.from on 2026-09-24 (CLI-083).
    # Two names, ONE credential and one rotation. hive's worker reads
    # HIVE_WORKER_API_KEY (its own contract, mlorentedev/hive#384) while opencode
    # and pi read NAN_API_KEY — the same NaN subscription under two consumer
    # names, which is exactly what expose.env's list form is for. Declaring a
    # second registry entry over the same bw item would instead give one
    # credential two rotation cadences that can drift apart.
    #
    # Note for callers: a multi-var secret is not resolvable through
    # `dotf secrets show` (one value to stdout is ambiguous for it) — use
    # `dotf secrets run --only NAN_API_KEY`, which selects BOTH vars because the
    # token matches the secret's id.
    expose: { env: [NAN_API_KEY, HIVE_WORKER_API_KEY] }
    # ci:… added by TOOL-013 (#786): the pr-agent workflow reviews pull requests
    # through NaN. Declared per-consumer rather than ambient, so the reviewer
    # holds exactly one credential — see #1025 for the cost of the alternative.
    # daemon:hive-worker added by CLI-042 (#1190): the hive serve unit takes it
    # from `dotf secrets run`, so it is a consumer that holds nothing at rest.
    # The other ci:… entries (2026-09-06): the pr-agent workflow rolled out to
    # every repository in the fleet, each one a consumer of the same credential.
    # Declared here so `dotf secrets sync ci --repo mlorentedev/<repo>` selects it;
    # the sync itself is a separate, per-repo action by the owner.
    # k8s:kubelab/pr-agent (TOOL-080): the forge's PR-Agent server reads a COPY
    # held in kubelab SOPS (apps.services.automation.pr_agent.nan_api_key), so a
    # rotation here does not reach it on its own. Re-copy after every rotation
    # with `make secrets-copy-nan-key`, then `make apply-secrets ENV=prod`, both
    # in kubelab.
    consumers:
      - agent:opencode
      - agent:pi
      - daemon:hive-worker
      - k8s:kubelab/pr-agent
      - ci:mlorentedev/dotfiles
      - ci:mlorentedev/ts-bridge
      - ci:mlorentedev/kubelab
      - ci:mlorentedev/web
      - ci:mlorentedev/garsync
      - ci:mlorentedev/hive
      - ci:mlorentedev/iris
      - ci:mlorentedev/mail2markdown
      - ci:mlorentedev/pdf-modifier-mcp
      - ci:mlorentedev/pollex
      - ci:mlorentedev/svqtriana.github.io
      - ci:mlorentedev/yt-metrics-cli
      - ci:mlorentedev/leaving-denver   # temporary repo; drop at its decommission (OPS-011)
    rotate: 90d

  # The pr-agent workflow's one review attempt outside NaN, when the NaN attempt
  # published nothing (AI-045 AC9, #1923). Claude API key `pr-agent-ci`, funded
  # ONLY by the Max plan's monthly API credit: no card on the organization, no
  # auto-reload, an organization spend limit at the credit's size. When the
  # credit runs out the API answers 400 and the job reports it; nothing is billed.
  #
  # Named for its purpose, not ANTHROPIC_API_KEY. A bare `dotf secrets run -- <cmd>`
  # exposes every entry, and ANTHROPIC_API_KEY is the name Anthropic's SDKs and
  # Claude Code read on their own: Claude Code would switch from the subscription
  # to this key and spend the review budget. No tool picks up this name.
  #
  # One consumer until another repository's workflow adopts the fallback in its
  # own pull request: a credential synced where nothing reads it only widens the
  # surface. The Console cannot restrict a key to a model, so the workflow pins
  # the model and a test pins the workflow (tests/pr-agent-config.bats).
  - id: PR_AGENT_ANTHROPIC_API_KEY
    plane: app
    backend: bw
    bw: { item: anthropic-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: PR_AGENT_ANTHROPIC_API_KEY }
    consumers: ["ci:mlorentedev/dotfiles"]
    rotate: 90d

  # The adversarial review's Anthropic members (AI-045, #1923, amendment B):
  # Haiku as the fallback first signer, Sonnet as the second signer of a
  # `risk: high` spec. pi reads it through ai/pi/models.json's anthropic-review
  # provider, and `dotf spec review` injects only this entry (the pool's
  # secret_id), so no other credential reaches the reviewer.
  #
  # The same Bitwarden item as PR_AGENT_ANTHROPIC_API_KEY, under a name of its
  # own (owner, 2026-10-09): one Console key and one spend limit cover PR-Agent
  # and the review, and rotating the item rotates both. Its own name keeps the
  # two consumers apart in every config, so giving the review a key of its own
  # later is a change to this one `item:` line. Named for its purpose and never
  # ANTHROPIC_API_KEY, for the reason given above.
  - id: REVIEW_ANTHROPIC_API_KEY
    plane: app
    backend: bw
    bw: { item: anthropic-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: REVIEW_ANTHROPIC_API_KEY }
    consumers: [local]
    rotate: 90d

  - id: POLLEX_API_KEY
    plane: app
    backend: bw
    bw: { item: pollex-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: POLLEX_API_KEY }
    consumers: ["agent:pollex"]
    rotate: 90d

  - id: STRIPE_API_KEY
    plane: app
    backend: bw
    bw: { item: stripe-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: STRIPE_API_KEY }
    consumers: ["ci:payments"]
    rotate: 180d

  - id: YOUTUBE_API_KEY
    plane: app
    backend: bw
    bw: { item: youtube-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: YOUTUBE_API_KEY }
    consumers: ["ci:yt-metrics"]
    rotate: 180d

  - id: BEEHIIV_API_KEY
    plane: app
    backend: bw
    bw: { item: beehiiv-api-key, field: api-key, folder: Dotfiles/apps }
    expose: { env: BEEHIIV_API_KEY }
    consumers: ["ci:newsletter"]
    rotate: 180d

  - id: BEEHIIV_DNS_RECORDS          # reference data, not a key → Secure Note
    plane: app
    backend: bw
    bw: { item: beehiiv-dns-records, field: notes, folder: Dotfiles/apps }
    expose: { env: BEEHIIV_DNS_RECORDS }
    consumers: [local]

  - id: PYPI_TOKEN
    plane: app
    backend: bw
    bw: { item: pypi-token, field: api-token, folder: Dotfiles/apps }
    expose: { env: PYPI_TOKEN }
    consumers: ["ci:publish"]
    rotate: 180d

  # X/Twitter — one OAuth credential, 7 vars sharing the bw item `x-twitter-api`.
  # Each var migrates independently (no multi-field special case).
  - id: X_API_KEY
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: api-key, folder: Dotfiles/apps }
    expose: { env: X_API_KEY }
    consumers: ["ci:social"]
    rotate: 180d

  - id: X_API_KEY_SECRET
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: api-key-secret, folder: Dotfiles/apps }
    expose: { env: X_API_KEY_SECRET }
    consumers: ["ci:social"]
    rotate: 180d

  - id: X_ACCESS_TOKEN
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: access-token, folder: Dotfiles/apps }
    expose: { env: X_ACCESS_TOKEN }
    consumers: ["ci:social"]
    rotate: 180d

  - id: X_ACCESS_TOKEN_SECRET
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: access-token-secret, folder: Dotfiles/apps }
    expose: { env: X_ACCESS_TOKEN_SECRET }
    consumers: ["ci:social"]
    rotate: 180d

  - id: X_BEARER_TOKEN
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: bearer-token, folder: Dotfiles/apps }
    expose: { env: X_BEARER_TOKEN }
    consumers: ["ci:social"]
    rotate: 180d

  - id: X_CLIENT_ID
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: client-id, folder: Dotfiles/apps }
    expose: { env: X_CLIENT_ID }
    consumers: ["ci:social"]
    rotate: 180d

  - id: X_CLIENT_SECRET
    plane: app
    backend: bw
    bw: { item: x-twitter-api, field: client-secret, folder: Dotfiles/apps }
    expose: { env: X_CLIENT_SECRET }
    consumers: ["ci:social"]
    rotate: 180d

  # ── infra: infrastructure access ─────────────────────────────────────────

  # Dedicated PoC automation identity for the private Teledyne Gitea
  # organization. The bot account's organization membership limits the resource
  # boundary; the PAT carries only repository/organization write scopes.
  - id: GITEA_TELEDYNE_TOKEN
    plane: infra
    backend: bw
    bw:
      item: gitea-teledyne-bot
      field: api-token
      folder: Dotfiles/infra
    expose: { env: GITEA_TELEDYNE_TOKEN }
    consumers: [local]
    rotate: 90d

  # Retired 2026-09-23, each checked by consequence (status codes and public
  # fingerprints only, never a value):
  # - HETZNER_API_TOKEN: both copies (hetzner-api-token, legacy Hetzner/"key")
  #   answered 401. The live Hetzner token is kubelab's (SOPS hetzner.api_key,
  #   200), which is where its consumers, Terraform and Ansible, read it.
  # - HETZNER_SSH_KEY: hetzner-ssh held a PUBLIC key (the deployment key Hetzner
  #   registers), which is not a secret, and nothing read it; Terraform reads
  #   ~/.ssh/id_ed25519.pub. The legacy Hetzner SSH item opens neither the VPS nor
  #   GitHub.
  # - TS_AUTHKEY: two different auth keys, both past Tailscale's 90-day maximum,
  #   and the Keys page holds none. Nothing consumed it ("ci:vpn" named no repo).
  #   Mint an auth key when a consumer needs one; do not store it.
  # The vault items were deleted through retired: on 2026-09-24 (CLI-082).
  - id: ACEMAGIC_OFFICE_SSH_KEY
    plane: infra
    backend: bw
    bw: { item: acemagic-office-ssh, field: notes, folder: Dotfiles/infra }
    expose: { file: { var: ACEMAGIC_OFFICE_SSH_KEY, path: "~/.ssh/id_ed25519_ts_bridge_acemagic", mode: "0600" } }
    consumers: [local]
    rotate: 365d

  - id: CLOUDFLARE_API_TOKEN
    plane: infra
    backend: bw
    bw: { item: cloudflare-api-token, field: api-token, folder: Dotfiles/infra }
    expose: { env: CLOUDFLARE_API_TOKEN }
    consumers: ["ci:dns", local]
    rotate: 180d

  - id: KUBECONFIG                   # multi-line kubeconfig → Secure Note; file expose
    plane: infra
    backend: bw
    bw: { item: kubelab-kubeconfig, field: notes, folder: Dotfiles/infra }
    expose: { file: { var: KUBECONFIG, path: "~/.kube/kubelab.config", mode: "0600" } }
    consumers: [local]

  # kubelab restic repository passwords: OFFSITE ESCROW copies, read by no consumer.
  # The live copy is kubelab's SOPS `backup.nodes.<node>.restic_password` (and the
  # shared `backup.restic_password`) in common.enc.yaml. Losing one makes that node's
  # backup history unrecoverable, so a second copy lives here, outside the cluster
  # that holds the first. kubelab writes each with `... | dotf secrets set <id>`, so
  # no value crosses a terminal. `expose` is required by the schema; nothing runs
  # with these, and `escrow:kubelab` names the owner rather than a reader.
  - id: KUBELAB_RESTIC_PASSWORD
    plane: infra
    backend: bw
    bw: { item: kubelab-restic-shared, field: password, folder: Dotfiles/infra }
    expose: { env: KUBELAB_RESTIC_PASSWORD }
    consumers: ["escrow:kubelab"]

  - id: KUBELAB_RESTIC_PASSWORD_ACE2
    plane: infra
    backend: bw
    bw: { item: kubelab-restic-ace2, field: password, folder: Dotfiles/infra }
    expose: { env: KUBELAB_RESTIC_PASSWORD_ACE2 }
    consumers: ["escrow:kubelab"]

  - id: KUBELAB_RESTIC_PASSWORD_BEELINK
    plane: infra
    backend: bw
    bw: { item: kubelab-restic-beelink, field: password, folder: Dotfiles/infra }
    expose: { env: KUBELAB_RESTIC_PASSWORD_BEELINK }
    consumers: ["escrow:kubelab"]

  - id: KUBELAB_RESTIC_PASSWORD_RPI3
    plane: infra
    backend: bw
    bw: { item: kubelab-restic-rpi3, field: password, folder: Dotfiles/infra }
    expose: { env: KUBELAB_RESTIC_PASSWORD_RPI3 }
    consumers: ["escrow:kubelab"]

  - id: KUBELAB_RESTIC_PASSWORD_RPI4
    plane: infra
    backend: bw
    bw: { item: kubelab-restic-rpi4, field: password, folder: Dotfiles/infra }
    expose: { env: KUBELAB_RESTIC_PASSWORD_RPI4 }
    consumers: ["escrow:kubelab"]

  - id: KUBELAB_RESTIC_PASSWORD_VPS
    plane: infra
    backend: bw
    bw: { item: kubelab-restic-vps, field: password, folder: Dotfiles/infra }
    expose: { env: KUBELAB_RESTIC_PASSWORD_VPS }
    consumers: ["escrow:kubelab"]

  # ── personal: recovery/backup codes, app passwords (personal) ────
  - id: ZOHO_RECOVERY_CODE
    plane: personal
    backend: bw
    bw: { item: zoho, field: recovery-code, folder: Dotfiles/personal }
    expose: { file: { var: ZOHO_RECOVERY_CODE, path: "~/.secrets/zoho-recovery-code.txt", mode: "0600" } }
    consumers: [local]

  - id: GMAIL_BACKUP_CODE
    plane: personal
    backend: bw
    bw: { item: gmail-backup-code, field: notes, folder: Dotfiles/personal }
    expose: { file: { var: GMAIL_BACKUP_CODE, path: "~/.secrets/gmail-backup-code.txt", mode: "0600" } }
    consumers: [local]

  # The two ChatGPT account codes share `openai-account` — the OpenAI ACCOUNT
  # (recovery), distinct from `openai-api-key` (the API credential).
  - id: CHATGPT_BACKUP_CODE
    plane: personal
    backend: bw
    bw: { item: openai-account, field: backup-code, folder: Dotfiles/personal }
    expose: { file: { var: CHATGPT_BACKUP_CODE, path: "~/.secrets/chatgpt-backup-code.txt", mode: "0600" } }
    consumers: [local]

  - id: CHATGPT_RECOVERY_CODE
    plane: personal
    backend: bw
    bw: { item: openai-account, field: recovery-code, folder: Dotfiles/personal }
    expose: { file: { var: CHATGPT_RECOVERY_CODE, path: "~/.secrets/chatgpt-recovery-code.txt", mode: "0600" } }
    consumers: [local]

  - id: STRIPE_BACKUP_CODE           # own item by decision (CLI-024-secrets-file-migrate); not grouped onto stripe-api-key
    plane: personal
    backend: bw
    bw: { item: stripe-backup-code, field: notes, folder: Dotfiles/personal }
    expose: { file: { var: STRIPE_BACKUP_CODE, path: "~/.secrets/stripe-backup-code.txt", mode: "0600" } }
    consumers: [local]

  # Unlocks the sealed private data on leaving-denver's /seller/ page (its ADR-007).
  # A login item, so the Bitwarden phone app can autofill the unlock field; add the
  # site URI in the app. `make ci-secrets` there writes it here when it generates one.
  - id: SELLER_PASSPHRASE
    plane: personal
    backend: bw
    bw: { item: leaving-denver-seller, field: password, folder: Dotfiles/personal }
    expose: { env: SELLER_PASSPHRASE }
    consumers: [local]

  # ── floor: offline-rooted boot/DR roots — NEVER migrated (no bw: block) ────
  - id: SSH_KEY                      # boot dependency: needed before bw is reachable
    plane: floor
    backend: age-offline
    age: id_ed25519
    expose: { file: { var: SSH_KEY, path: "~/.ssh/id_ed25519", mode: "0600" } }
    consumers: [local]

  # The root of the hierarchy, and the reason `file-authority` exists (#937). Every
  # `age`/`age-offline` secret above is decrypted with THIS file, so it cannot be one
  # of them: it would have to be encrypted under itself. Nothing resolves it; verify
  # asks whether it is present and 0600, and `run` refuses to hand it to a child.
  #
  # The `bw:` block is the CONVENIENCE copy, not the authority — authority is this
  # disk. It carries no folder because the ratified taxonomy has none for floor
  # (`validBWFolders`: apps, infra), and placing it is an ADR decision rather than a
  # registry one. Nothing reads this block yet; it names where the drift comparison
  # of #1000 will look.
  #
  # Not yet true, and the gap that matters: this file's only off-machine copy is in
  # Bitwarden — the thing the DR escrow exists to survive the loss of (#1000).
  - id: AGE_KEY_PERSONAL             # the root: decrypts every age secret and the DR escrow
    plane: floor
    backend: file-authority
    # The age PUBLIC recipient — public by construction, it is what someone uses to
    # encrypt TO this key, which is why it is committed while nothing else here is.
    # verify derives it from the file with `age-keygen -y` and refuses a mismatch:
    # a root replaced, truncated or restored from the wrong backup passes every other
    # check and stays indistinguishable from a healthy one until the day it is needed.
    recipient: age166v8efpskctmxxes5lcqpxkj0ny3q74l3v0pswpdpa63wlkqmc8q35fkdw
    bw: { item: AGE-SECRET-KEY-PERSONAL, field: notes }
    expose: { file: { var: AGE_KEY_PERSONAL, path: "~/.config/age/key.txt", mode: "0600" } }
    consumers: [local]

# Items deleted from the store by declaration (CLI-082). `reconcile` plans a
# delete-item for each one the vault still holds, shown with its shape; once the
# plan reports it gone, its entry is removed from here.
# An entry may name a field: (CLI-083) for a dead legacy value beside a live
# credential, which no retire can verify equal; reconcile plans a delete-field.
# Emptied on 2026-09-24, after Stripe/backup-codes and login.tailscale.com/auth-key
# were removed. Emptied again on 2026-09-29, after zoho/app-passwords was removed.
# docs/secrets-inventory.md records why each one went.
retired: []
