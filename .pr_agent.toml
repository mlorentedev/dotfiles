# PR-Agent (qodo-ai/pr-agent, MIT) backed by NaN cluster inference — TOOL-013 (#786).
#
# Why this exists: CodeRabbit's free tier gives ~1 review per hour, account-wide.
# On 2026-08-16 three PRs from three parallel sessions each carried a "Review
# limit reached" notice, zero reviews between them, and a green `CodeRabbit pass`
# check. Review capacity, not review quality, became the binding constraint on
# throughput. A reviewer without a per-hour account quota removes the queue
# rather than scheduling around it.

[config]
# `openai/` prefix selects LiteLLM's OpenAI-compatible transport; the endpoint
# is NaN's, set as OPENAI.API_BASE in the workflow. The model itself is not the
# hosted OpenAI one.
#
# deepseek-v4-flash is not a guess. #786's body argued from a 2026-06-11 research
# note that REJECTED PR-Agent because "local-model quality drops below the bar",
# then reasoned that cluster inference should be a different tier. That was a
# projection. It is now measured: three adversarial reviews ran on this model on
# 2026-08-16 and each produced findings a rubber stamp would not — including a
# security hole in GUARD-002 (the gate ran its own classifier from the PR under
# review, so a PR could edit it to attest itself) and a vacuous test predicate.
model = "openai/deepseek-v4-flash"

# NO cheap fallback, and this deliberately departs from #786's draft, which
# proposed `fallback_models = ["qwen3.6"]`.
#
# harness/reviewer-pool.json excludes qwen3.6 from the adversarial-review pool by
# name, on the grounds that "a reviewer that PASSes cheaply is worse than no
# gate, because it converts the gate into a green checkmark". Adopting it as a
# fallback here would put two files in the repo holding opposite policies on who
# may review.
#
# The safe direction is available precisely because GUARD-002 exists: if this
# reviewer fails, the review-attestation gate reports `declined` and the PR goes
# red. A failure is therefore VISIBLE, which makes "no review" strictly better
# than "a cheap review that passes everything". Falling back to a
# latency-optimised model would trade a loud absence for a quiet rubber stamp.
fallback_models = []

# Cheap passes only — descriptions and commit summaries, never the review.
model_weak = "openai/qwen3.6"

# NaN models are absent from LiteLLM's registry, so the token budget must be
# stated explicitly or LiteLLM assumes a small default and truncates the diff.
# deepseek-v4-flash advertises 1M context; 200k is a deliberate floor well inside
# it, raised only against measured need.
custom_model_max_tokens = 200000
max_model_tokens = 200000

# The reviewer answers in English to ensure all durable PR review records and
# review comments remain strictly in English per global harness doctrine.
# Release PRs are not reviewed, and this pairs with an exemption in
# harness/review-attestation.json — the two must move together or the change
# makes things worse.
#
# Why not review them: a release PR restates commits already on main, each
# reviewed when it merged. PR-Agent's ticket-compliance analysis reads the
# CHANGELOG's issue references, looks for their code in the diff, and reports
# "none of the above requirements are fulfilled" — structurally, on every
# release. Measured on #1049. That is noise guaranteed to recur, and noise from
# a reviewer is how a reviewer stops being read.
#
# Why the pairing is load-bearing: excluding them here WITHOUT the gate
# exemption produces a release PR with no reviewer output at all, which the
# attestation gate correctly calls `pending` and which nothing can ever clear —
# the unreachable state filed as #1061. One half alone is worse than neither.
#
# Source branch rather than title or author: the title is free text, and the
# author is a human (release-please runs under a PAT), so an author rule would
# never fire. The gate's half matches on diff signature instead, deliberately
# not on this branch name — two independent conditions, so neither is a single
# string that lets a change past both.
ignore_pr_source_branches = ["^release-please--"]

response_language = "en-US"

# AGENTS.md is this repo's behavioural SSOT, so the standing orders, the
# English-only rule, the no-auto-merge rule and the shell-compatibility table all
# enter the review prompt with no extra wiring. This is the single highest-value
# line in the file.
repo_context_files = ["AGENTS.md", ".claude/CLAUDE.md"]

# .claude/CLAUDE.md was NOT here originally, and its absence made the
# extra_instructions below refer to a file the reviewer could not read: they say
# "see the prohibited-pattern table in .claude/CLAUDE.md", which is where the
# bash/zsh rules actually live. An instruction naming a source that is not in
# context is the same shape as a guard citing a check it cannot run — it reads as
# rigour and asserts nothing. The two files together are the harness as a
# reviewer can see it: AGENTS.md carries the standing orders and the enforced
# regions, CLAUDE.md the repo-specific tables and verification commands.

[pr_reviewer]
# Inline comments on the diff, which is the half CodeRabbit's free tier withholds
# on private repos and the reason this work exists.
require_score_review = false
require_tests_review = true
require_security_review = true
persistent_comment = true
final_update_message = false

extra_instructions = """
Open every review with a HARNESS COMPLIANCE pass over the two context files
(AGENTS.md and .claude/CLAUDE.md), stating PASS or FAIL per item with the
offending file and line. Report it even when everything passes — a silent
section is indistinguishable from a section that was skipped. Check at least:

- English only in the durable record: commit messages, branch name, PR title and
  body, code comments. Conversation may be any language; artifacts may not.
- No AI attribution anywhere in git or GitHub artifacts: no Co-Authored-By
  naming an agent, no "Generated with" footer, no bot emoji signature.
- No internal phase or milestone reference in the branch name, commit messages
  or PR title.
- Shell that must run under BOTH bash and zsh: check the changed lines against
  the prohibited-pattern table in .claude/CLAUDE.md, including the three rows
  that fail SILENTLY (unmatched glob in a for, unquoted word-splitting, and a
  slashless argument to the source builtin).
- Definition of Done, on the PR as submitted: debt fixed or ticketed, knowledge
  written where it belongs, the ticket moved, review output dispositioned,
  and a completion claim backed by command output rather than assertion.
- Spec-Driven Development: a change of this size either touches a specs/<id>/
  folder or carries the skip-sdd label with a written rationale.
- No auto-merge: nothing in the diff enables it, and no workflow merges a PR
  without a human.

Then continue with the substance.

This repository already runs shellcheck, bats, golangci-lint, go vet and gitleaks
in CI. Do not restate what a linter reports; that is covered and it is noise here.

Spend the budget on what static analysis cannot see:
- a guard that cannot fail the way its comment claims, or that reports on a
  system it perturbs;
- a test that passes vacuously — a negated assertion in the middle of a bats
  @test is exempt from set -e and is silently ignored;
- a check whose only reachable branch is the no-op one;
- cross-file consequences a single-hunk reader would miss.

Shell must run under bash AND zsh; see the prohibited-pattern table in
.claude/CLAUDE.md before flagging or accepting shell constructs.

Classify each finding by whether it is REAL, THEORETICAL or SPECULATIVE, and say
which. A finding without that gradation is hard to action.
"""

[pr_code_suggestions]
# This section did not exist, and its absence made the `[pr_reviewer]` comment
# above false. That comment says inline comments on the diff are "the reason this
# work exists" — but `review` never posts inline by design; `improve` does, and
# without this section `improve` ran on defaults with dual publishing DISABLED.
# Measured across #1042, #1047 and #1051: 2 PR-Agent comments each, **0 inline**.
# The stated reason for the tool being here had never been configured.
#
# Only the settings that actually change behaviour are listed. Three more were
# proposed — commitable_code_suggestions, focus_only_on_problems and
# persistent_comment — and all three are already the upstream default at the
# pinned tag, so declaring them would assert a change that does not happen. The
# action is pinned by tag, so those defaults cannot drift under us without a
# deliberate bump.

# Default is -1, which DISABLES inline publishing entirely. This is the line that
# makes the [pr_reviewer] claim true. 7 is the score upstream's own scoring
# mechanism calls "medium" (new_score_mechanism_th_medium), so it is the
# documented boundary above which a suggestion is more than stylistic — not a
# recommendation for this setting specifically, which upstream does not give.
dual_publishing_score_threshold = 7

# Default is 0, i.e. publish everything. The scale is 0-10 and upstream warns
# against going above 8 because it clips relevant suggestions. 5 is the midpoint:
# below it is style, which shellcheck, golangci-lint and PSScriptAnalyzer already
# own in this repo, and restating them is the noise extra_instructions forbids.
suggestions_score_threshold = 5

# Default is true, which posts "No code suggestions found for the PR" as a second
# bot comment carrying no information. Suppressed for noise alone — note it is
# NOT to avoid re-triggering workflows: comments authored with GITHUB_TOKEN emit
# no events at all, which is the defect #1052 exists to fix.
publish_output_no_suggestions = false

[ignore]
# Path-based exclusion, so the rule lives in a file rather than in memory. The
# diff leaves this infrastructure only at the model call, and these filters run
# before it.
#
# sensitive/** is the load-bearing entry: it holds age ciphertext and the DR
# escrow. Encrypted or not, credential material is not sent to an inference
# endpoint to be reviewed.
glob = [
  "sensitive/**",
  "!sensitive/registry-example.yaml",
  "specs/**/review-transcript.jsonl*",
]
