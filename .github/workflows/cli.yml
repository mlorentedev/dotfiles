name: cli

on:
  # No paths filter on pull requests: cli-gate is a required check, and a
  # required check a filtered workflow never reports stays pending. The
  # `changes` job skips the Go work instead, and a skipped job still lets
  # cli-gate report (CI-004, #1739).
  pull_request:
  # No paths filter on main either: the Go tests read files outside cli/ (the
  # golden corpora under tests/golden/, harness/*.json, the shell rc files), and a
  # push filtered to cli/** never ran the guard written for those files (#1888).
  # The `changes` job narrows lint and the snapshot build, never the tests.
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  changes:
    name: cli-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Gates lint and the snapshot build only; the tests run on every diff
      # (#1888). A tag always builds. On a push to main the filter compares the
      # push against the commit before it.
      go: ${{ startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.go == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: "!startsWith(github.ref, 'refs/tags/')"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        id: filter
        with:
          filters: |
            go:
              - 'cli/**'
              - 'versions.conf'
              - '.github/workflows/cli.yml'

  # Not gated on the path filter. Go tests guard files outside cli/ (#1888): an
  # allow-list filter treats every unlisted path as safe to skip (lesson 322), and
  # the guard written for a file never ran on the diff that changed it. setup-go
  # restores GOCACHE, so `go test` reruns only the packages whose inputs changed,
  # files read at test time included: on a diff outside cli/ this costs about 30 s
  # on Linux and 95 s on Windows, in parallel with ci.yml's longer legs.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Smoke (help + version)
        run: |
          go run ./cmd/dotf --help
          go run ./cmd/dotf version

  # Not `lint`: ci.yml's shell lint reports that name, and two reporters of a
  # required check make it pass on whichever finished last.
  lint:
    name: cli-lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # Resolve the pin from versions.conf (BUG-071). Without an explicit
      # version the action takes `latest`, so a local run proves nothing about
      # CI and a linter release can turn main red with no change here.
      - name: Resolve pinned golangci-lint version
        id: golangci
        working-directory: ${{ github.workspace }}
        run: |
          . ./versions.conf
          if [ -z "${GOLANGCI_LINT_VERSION:-}" ]; then
            echo "GOLANGCI_LINT_VERSION missing from versions.conf" >&2
            exit 1
          fi
          echo "version=v${GOLANGCI_LINT_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: cli
          version: ${{ steps.golangci.outputs.version }}

  # The one required check from this workflow. It reports on every pull
  # request: green when every Go job passed, or was skipped because the diff
  # has no Go change; red otherwise, including when `changes` itself failed.
  # Requiring the matrix jobs directly would not work: skipped at job level,
  # GitHub reports them under the unexpanded name `test (${{ matrix.os }})`.
  # `needs` lists every job that can run on a pull request, the goreleaser
  # snapshot included; tests/workflow-job-names.bats fails on one left out.
  cli-gate:
    name: cli-gate
    needs: [changes, test, lint, release-snapshot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Go job passed, or was skipped for a diff with no Go change
        working-directory: ${{ github.workspace }}
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a Go job ended '$r' (results: $RESULTS)"; exit 1 ;;
            esac
          done

  release-snapshot:
    name: goreleaser snapshot
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
          workdir: cli
      - name: List produced binaries
        run: ls -R dist/

  release:
    name: goreleaser release
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
