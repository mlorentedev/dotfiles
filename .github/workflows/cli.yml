name: cli

on:
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Smoke (help + version)
        run: |
          go run ./cmd/dotf --help
          go run ./cmd/dotf version

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # Resolve the pin from versions.conf (BUG-071). Without an explicit
      # version the action takes `latest`, so a local run proves nothing about
      # CI and a linter release can turn main red with no change here.
      - name: Resolve pinned golangci-lint version
        id: golangci
        working-directory: ${{ github.workspace }}
        run: |
          . ./versions.conf
          if [ -z "${GOLANGCI_LINT_VERSION:-}" ]; then
            echo "GOLANGCI_LINT_VERSION missing from versions.conf" >&2
            exit 1
          fi
          echo "version=v${GOLANGCI_LINT_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: cli
          version: ${{ steps.golangci.outputs.version }}

  release-snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
          workdir: cli
      - name: List produced binaries
        run: ls -R dist/

  release:
    name: goreleaser release
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
