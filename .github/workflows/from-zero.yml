name: from-zero

# A machine from zero (#2013 X1, PLAT-001b PR 6): on a fresh hosted runner,
# install.sh, then `dotf doctor --scope machine`, then a second `dotf converge`
# that must change nothing. It proves the one entrypoint brings up macOS and
# Linux, and that the result is idempotent.
#
# The `dotf` under test is the PR's source build, put on PATH before
# install.sh runs. install.sh keeps a source build (it reports `dev`) and
# hands the machine to it, so the job tests this tree's converge, not the last
# release's. install.sh's download-and-verify path is covered by the file://
# fixture in tests/install.bats, not here.
#
# `from-zero-gate` is the check branch protection can require. A required
# check that a filtered workflow never reports stays pending, so the workflow
# runs on every pull request and its `from-zero-changes` job narrows the
# machine matrix to the owner's trigger (2026-10-10): the install path on pull
# requests, every push to main. The gate reports on every pull request, green
# when both runners passed or were skipped for a diff outside that path (the
# cli-gate pattern, CI-004 #1739). Hosted macOS minutes are free on a public
# repository; the cost is wall-clock and the macOS concurrency it shares with
# test-macos, which the filter keeps to the diffs that can break a bootstrap.
#
# No continue-on-error anywhere: a red run that names its cause is the design.
# doctor's FAILs that the #2013 ledger already owns are listed with their
# owners and gated both ways (from-zero-doctor-gate.sh), not ignored.
on:
  # No paths filter: from-zero-gate must report on every pull request.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Narrows the machine matrix on pull requests to the install path; a push to
  # main and a manual run always build the machine, so the default branch
  # carries a run for every commit (PLAT-001b AC9).
  changes:
    name: from-zero-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      install: ${{ github.event_name != 'pull_request' || steps.filter.outputs.install == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            install:
              - 'install.sh'
              - 'install.ps1'
              - 'cli/internal/converge/**'
              # Converge's own path outside its package: the command and its
              # identity epilogue, and the git-hooks step's installer.
              - 'cli/internal/cmd/converge.go'
              - 'cli/internal/cmd/identity.go'
              - 'cli/internal/identity/**'
              - 'cli/internal/hooks/**'
              - 'packages.json'
              - 'versions.conf'
              - 'env-contract.json'
              - '.github/workflows/from-zero.yml'
              - '.github/scripts/from-zero-doctor-gate.sh'
              - '.github/scripts/from-zero-known-failures.txt'

  from-zero:
    name: from-zero (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The checkout converge and doctor read. Without it both look under the
      # default ~/Projects/dotfiles, which a runner does not have.
      DOTFILES_REPO_DIR: ${{ github.workspace }}
      # mise and aqua download from GitHub releases; hosted runners share
      # rate-limited addresses, and an anonymous run of every pin fails
      # intermittently.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build the dotf under test onto PATH
        working-directory: cli
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/dotf" ./cmd/dotf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install.sh (first converge)
        id: install
        run: ./install.sh

      # BUG-138 (#2481): the ansible version probes fail now and then on macOS,
      # and converge keeps a probe's output to itself. On a failed first
      # converge, print what the probes read, and the locale they ran under:
      # ansible refuses to start without a UTF-8 one.
      - name: Show the version probes' raw output
        if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: |
          locale || true
          for t in ansible ansible-lint; do
              out=$("$HOME/.local/bin/$t" --version 2>&1) && rc=0 || rc=$?
              echo "== $t --version: exit $rc"
              printf '%s\n' "$out" | head -5 | cat -v
          done

      # Idempotence is defined on a converged first run (lesson 328): assert
      # that before reading the second run, so a step that warned and went on
      # is named here and not mistaken for drift below.
      - name: The first converge succeeded
        id: first
        run: |
          report="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/converge/last.json"
          cat "$report"
          jq -e '.result == "ok" and ([.entries[] | select(.status == "failed")] | length == 0)' "$report" >/dev/null || {
            echo "::error::the first converge did not succeed; see the report above"
            exit 1
          }

      # The agents are what a workstation is for (#2317): mise installs Claude
      # Code, agy and pi on both runners (versions.conf `# mise: latest`, #2013
      # P5c). Asked in the interactive shell, like doctor below, because that
      # is where `mise activate` puts them on PATH. `command` runs the binary
      # and skips any shell function of the same name: the rc file wraps pi in
      # `dotf secrets run`, which a runner without Bitwarden cannot satisfy,
      # and `command -v` reports the wrapper rather than a path.
      - name: The agents resolve on PATH
        run: |
          sh_=bash; command -v zsh >/dev/null 2>&1 && sh_=zsh
          for agent in claude agy pi; do
            "$sh_" -ic "command $agent --version" || {
              echo "::error::$agent is not on PATH after the first converge"
              exit 1
            }
          done

      # Doctor asks what a person sees in a new terminal, so it runs in the
      # interactive shell the converge just configured: its rc file activates
      # mise, which a bare CI step never sources, and without it every mise
      # tool reads as missing from PATH.
      #
      # --scope machine: a runner has no identity (age key, Bitwarden, gh
      # login, vault), and none is fabricated for it. Those checks print a SKIP
      # naming their restore step, so a FAIL here is a defect of the bootstrap
      # (#2013 D10, docs/runbooks/guide-new-machine.md).
      #
      # The FAILs the epic already owns are listed, each with its owner, in
      # .github/scripts/from-zero-known-failures.txt. The gate fails on any
      # other FAIL and on an entry no FAIL matches any more, so the list only
      # shrinks and a regression still turns the job red.
      - name: dotf doctor --scope machine
        run: |
          rc=0
          if command -v zsh >/dev/null 2>&1; then
            zsh -ic 'dotf doctor --scope machine' > "$RUNNER_TEMP/doctor.out" 2>&1 || rc=$?
          else
            bash -ic 'dotf doctor --scope machine' > "$RUNNER_TEMP/doctor.out" 2>&1 || rc=$?
          fi
          cat "$RUNNER_TEMP/doctor.out"
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          .github/scripts/from-zero-doctor-gate.sh "$os" "$rc" "$RUNNER_TEMP/doctor.out"

      # Its own signal: a red doctor must not hide whether the machine is
      # idempotent, so this runs whenever the first converge succeeded.
      - name: Second converge changes nothing
        if: ${{ !cancelled() && steps.first.outcome == 'success' }}
        run: |
          dotf converge
          report="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/converge/last.json"
          cat "$report"
          jq -e '.result == "ok" and .changed == 0' "$report" >/dev/null || {
            echo "::error::the second converge was not a no-op; the entries with changes are the non-idempotent steps"
            exit 1
          }

  # The one check from this workflow branch protection can require. Requiring
  # the matrix jobs would not work: skipped at job level, GitHub reports them
  # under the unexpanded name `from-zero (${{ matrix.os }})`. Red when either
  # runner failed or was cancelled, or when `changes` itself failed.
  from-zero-gate:
    name: from-zero-gate
    needs: [changes, from-zero]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both runners passed, or were skipped for a diff outside the install path
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a from-zero job ended '$r' (results: $RESULTS)"; exit 1 ;;
            esac
          done
