name: Repo hygiene

# Repository hygiene: the lessons' canonical form, unique numbers, resolving
# wikilinks and generated index (`dotf lessons fmt --check`, run from the
# checkout so it never waits for a release), and SHA-pinned actions
# (`dotf lint fleet --rule fleet/sha-pin`, also from the checkout). Each step
# prints what failed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check; a push
# to main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Lessons in their canonical form, index generated from them
        working-directory: cli
        run: go run ./cmd/dotf lessons fmt --check --dir ../docs/lessons
      - name: Actions pinned to commit SHAs, in workflows and local actions
        working-directory: cli
        run: go run ./cmd/dotf lint fleet --dir .. --rule fleet/sha-pin
