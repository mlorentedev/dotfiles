name: review-attestation

# GUARD-002 (#906): make a green check mean *reviewed*.
#
# On 2026-08-16 three PRs (#1007, #1009, #1013) each carried a CodeRabbit
# comment saying no review had started, zero entries in reviews[], and a
# `CodeRabbit  pass` line in `gh pr checks`. The only mechanical signal
# available asserted the opposite of the truth. This job adds an honest one
# beside it — it cannot change the vendor's own check status.
#
# NOT `required` in branch protection, deliberately and for now: landing it as
# required would block every open PR the moment it merges. Adopt, observe,
# promote separately.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches: [main]
  # The load-bearing trigger. A reviewer usually lands AFTER the checks have
  # settled, which is the one moment the answer is always "pending" — asking
  # only at `pull_request` time would guarantee the least useful answer. A new
  # comment is exactly the event that can flip the verdict, so the gate settles
  # by itself without anyone pushing.
  issue_comment:
    types: [created, edited]
  # The trigger `issue_comment` cannot be. GitHub suppresses workflow events for
  # comments created with GITHUB_TOKEN, to stop workflows retriggering
  # themselves — and PR-Agent, the reviewer this repo shipped so CodeRabbit's
  # quota would stop gating throughput, publishes with GITHUB_TOKEN. Measured
  # 2026-08-18: its two comments on #1047 triggered ZERO runs here, while two
  # human comments on other PRs each triggered one within three seconds. So on
  # a PR where PR-Agent is the only reviewer — CodeRabbit rate-limited, this
  # repo's ordinary state — the verdict is computed seconds after the PR opens,
  # the review lands about ninety seconds later, and nothing ever re-asks.
  #
  # `workflow_run` is not a comment event and is outside that suppression.
  # Note it only fires for the copy of this file on the DEFAULT BRANCH, so it
  # cannot be exercised by the pull request that introduces it (#1052 AC1).
  workflow_run:
    workflows: [pr-agent]
    types: [completed]

concurrency:
  # Same reasoning as spec-gate.yml (BUG-066): metadata-only events must not
  # cancel a run in flight. Applying this gate's escape takes TWO changes — the
  # label and the body section — which fire `labeled` and `edited` within the
  # same second, and under an unconditional cancel they raced into cancelling
  # each other, leaving a stale failure as the visible check.
  # The workflow_run fallback is load-bearing, not defensive. A workflow_run
  # payload carries neither number, so without it every such run collapses
  # into ONE group keyed on the empty string, and `completed` is not in the
  # exempt list below — so a reviewer finishing on one PR would cancel the
  # re-evaluation of another. That is the defect #1040 was, one workflow over.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: ${{ !contains(fromJSON('["labeled", "unlabeled", "edited", "created"]'), github.event.action) }}

permissions:
  contents: read
  pull-requests: read
  # Required by the issue_comment path, and it is not optional there. A run
  # triggered by issue_comment is associated with the DEFAULT BRANCH, not with
  # the PR's head commit, so its check-run never appears on the PR. Measured on
  # this workflow's own first PR (#1019): the pull_request run attached to the
  # head SHA correctly, and the comment that landed 14s later could not update
  # it. Without an explicit commit status the issue_comment trigger would
  # execute and change nothing visible — a re-run that only appears to re-run.
  statuses: write

jobs:
  attestation:
    # issue_comment fires on issues too; only pull requests have a review state
    # to attest to.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      # Pinned to the BASE branch, never the PR's head. Without this the job
      # checked out the pull request and ran the classifier and registry from
      # it — so a PR could edit `scripts/check-review-attestation.sh` to exit 0
      # unconditionally, or add its own login to the reviewer registry, and
      # attest itself. The gate was disableable by the thing it judges.
      #
      # `pull_request_target` would also fix that and is the usual advice, but
      # it is the bigger hammer: it runs with a writable token in the base
      # repo's context, which is the standard privilege-escalation footgun. It
      # is not needed here because this job reads the PR only through the API —
      # it never builds, executes or even reads the PR's tree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      # A workflow_run payload carries neither `pull_request.number` nor
      # `issue.number`, so the expression the other two triggers use evaluates to
      # the empty string. Resolving the pull request from the run's head SHA is
      # the substance of that trigger, not a detail: a gate that re-evaluates the
      # WRONG pull request is worse than one that does not re-evaluate at all,
      # because it publishes a confident verdict about a change nobody reviewed.
      #
      # Filtered to OPEN pull requests. A head SHA can belong to several — a
      # merged one and a later branch reusing it — and attesting a closed PR is
      # noise at best. When none is open there is nothing to attest, which is a
      # normal outcome (pr-agent also runs on pushes to branches without a PR)
      # and is reported rather than failed.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECT: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$DIRECT" ]; then
            echo "number=$DIRECT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RUN_SHA}/pulls" \
                     --jq 'map(select(.state == "open")) | .[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open pull request for ${RUN_SHA} — nothing to attest"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "re-evaluating PR #${number} because the reviewer finished"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check review attestation
        id: attest
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Through `env:` and quoted at the use site, never interpolated into
          # the run: body. Both fields are integers minted by GitHub rather than
          # attacker-supplied text, so this is belt-and-braces — but the habit is
          # what keeps a future edit from reaching for `.title` or `.body` the
          # same way and meaning it.
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        # No `continue-on-error`: a red check here is the entire product. The
        # script itself distinguishes 1 (not reviewed, and not declared) from 2
        # (could not determine), and both are failures — "could not determine"
        # rendering as green is the bug this exists to end.
        #
        # The exit code is captured rather than allowed to end the step, so the
        # status below is always published; the step's own result is restored at
        # the end so the run still reflects reality.
        run: |
          # The gate runs from the BASE branch (see checkout above), so on the
          # PR that first introduces it the script does not exist yet. That is
          # not a failure: a gate which is not deployed cannot judge anything,
          # and failing every PR because the gate has not merged yet would be
          # absurd. Reported explicitly rather than skipped silently — and it
          # is not a hole, because a PR cannot remove a file from its own base.
          if [ ! -x scripts/check-review-attestation.sh ]; then
            echo "review-attestation is not active on ${GITHUB_BASE_REF:-the base branch} yet — nothing to enforce"
            {
              echo "code=0"
              echo "sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
              echo "summary=gate not yet on the base branch — nothing to enforce"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          scripts/check-review-attestation.sh --pr "$PR_NUMBER" 2>&1 | tee /tmp/attest.out
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "code=$code"
            echo "sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
            echo "summary=$(head -1 /tmp/attest.out | cut -c1-130)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the verdict onto the PR head
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.attest.outputs.sha }}
          CODE: ${{ steps.attest.outputs.code }}
          SUMMARY: ${{ steps.attest.outputs.summary }}
        # This is what makes the issue_comment trigger real rather than
        # decorative: the verdict lands on the PR's head commit, so a review
        # arriving after the checks settled flips a signal the PR actually
        # shows, with no push.
        run: |
          if [ "$CODE" = "0" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="review-attestation" \
            -f description="$SUMMARY" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Fail the run when the PR is not attested
        if: steps.pr.outputs.skip != 'true'
        env:
          CODE: ${{ steps.attest.outputs.code }}
          SUMMARY: ${{ steps.attest.outputs.summary }}
        # The verdict is repeated here, not just in the step that computed it.
        # A bare `exit "$CODE"` made the RED step say nothing: the diagnostic sat
        # in an earlier, green step, so anyone opening the failure saw an exit
        # code and no reason. Reported by a parallel session whose PRs this gate
        # began failing.
        #
        # That is this gate's own fourth constraint — a check that fails closed
        # must still say why — violated one layer up, inside the check built to
        # enforce it. Collapsing "why" into an exit code is the same defect as
        # #988's error path discarding HTTP 500 and surfacing `invalid character
        # 'I'`: the diagnostic threw away the diagnosis.
        run: |
          if [ "$CODE" != "0" ]; then
            echo "::error title=Review attestation::$SUMMARY"
            echo "$SUMMARY"
            echo
            echo "Options:"
            echo "  (a) Get the PR reviewed. This gate re-runs on new comments — no push needed."
            echo "  (b) Declare the unreviewed merge: add the 'merged-unreviewed' label AND a"
            echo "      non-empty '## Unreviewed merge rationale' section to the PR body."
            echo
            echo "This check is NOT required in branch protection: it reports, it does not veto."
            echo "Proceeding on an unreviewed PR is allowed. Proceeding silently is not."
          fi
          exit "$CODE"
