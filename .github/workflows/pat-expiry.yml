name: PAT expiry preflight

# Weekly liveness + expiry preflight for the PAT-backed Actions secrets that drive
# automation: RELEASE_TOKEN (release-please tag push → goreleaser) and BITACORA_PAT
# (Projects v2 board moves). A classic PAT expired silently and broke release-please's
# first run with "Bad credentials" (CLI-011/#369) — nothing warned beforehand.
#
# This job probes GET /user with each secret, reads the
# github-authentication-token-expiration response header, and opens or UPDATES a
# deduplicated `pat-expiry`-labelled issue (one per secret, stable title) when a
# token is invalid/expired or within WARN_DAYS of expiry — so a rotation reminder
# lands in the backlog BEFORE the next release run goes red.
#
# Liveness is necessary but not sufficient: a token can authenticate yet lack the
# *permission* its job needs. RELEASE_TOKEN must open release-please's PR, so the
# job also probes that capability (POST /pulls, non-destructively) and fails when
# the token is alive but missing 'Pull requests: write' — the gap that let a
# rotated RELEASE_TOKEN pass this preflight while every release silently broke.
#
# A token that is ALREADY invalid/expired also FAILS the job (red), not just files
# an issue: a backlog reminder was silently ignored once (BITACORA_PAT died, the
# board automation 401'd for days) so the alarm must be unmissable. An expiring-soon
# token (still valid, within WARN_DAYS) stays a soft heads-up — issue only, green job
# — because the whole point is to warn while it still works. Automatic rotation is
# HARNESS-022/#378. See specs/OPS-009-pat-expiry-preflight/.
#
# The issue calls use the default GITHUB_TOKEN (issues: write); each secret under
# test is used ONLY as the probe's Authorization bearer, never to write.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC — well clear of the release cron
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Days before expiry at which to alert'
        required: false
        default: '14'

permissions:
  issues: write

concurrency:
  group: pat-expiry
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh label/issue calls need a repo context; this job has no actions/checkout,
      # so set GH_REPO (gh's default-repo env var) instead of a bare .git. Without it
      # every gh call dies with "fatal: not a git repository" before any token is
      # probed — the latent bug that silently broke this preflight since it shipped.
      GH_REPO: ${{ github.repository }}
      WARN_DAYS: ${{ github.event.inputs.warn_days || '14' }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      BITACORA_PAT: ${{ secrets.BITACORA_PAT }}
    steps:
      - name: Probe PAT-backed secrets and alert on expiry
        run: |
          set -euo pipefail

          # The dedupe label must exist before `gh issue create --label` can use it.
          gh label create pat-expiry \
            --description "PAT-backed Actions secret expiring or invalid (OPS-009)" \
            --color D93F0B --force >/dev/null

          # alert NAME REASON [REMEDIATION] — open a `pat-expiry` issue for NAME, or
          # comment on the existing open one (dedupe by stable title), so a weekly cron
          # never spams. REMEDIATION overrides the default rotate instructions — a
          # permission gap is fixed by granting a scope, not by rotating the value.
          alert() {
            local name="$1" reason="$2" remediation="${3:-}"
            local title="PAT expiry: ${name}"
            if [ -z "${remediation}" ]; then
              remediation="**Rotate it**: update the secret in its store (age or Bitwarden), then sync the
          value to the repository Actions secret (\`dotf secrets sync ci --repo <owner/repo>\`)."
            fi
            local existing
            existing=$(gh issue list --state open --label pat-expiry \
              --json number,title \
              --jq "[.[] | select(.title==\"${title}\") | .number] | first // empty")
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "Still flagged on $(date -u +%F): ${name} ${reason}."
              echo "::notice::updated existing issue #${existing} for ${name}"
            else
              gh issue create --title "${title}" --label pat-expiry --body \
          "The Actions secret \`${name}\` ${reason}.

          ${remediation}

          Filed automatically by \`.github/workflows/pat-expiry.yml\` (OPS-009)."
              echo "::warning::opened a pat-expiry issue for ${name}"
            fi
          }

          # check_token NAME VALUE — probe one secret and classify it. Mirrors the
          # checks_pat.go decision tree: empty/offline → warn-and-skip (not a failure);
          # non-200 → invalid; expiry within threshold → alert; else healthy.
          check_token() {
            local name="$1" value="$2"
            if [ -z "${value}" ]; then
              echo "::warning::${name} secret is empty/unset — skipping"
              return 0
            fi

            local headers status expiry
            if ! headers=$(curl -fsS -m 10 -D - -o /dev/null \
                  -H "Authorization: Bearer ${value}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "User-Agent: pat-expiry-preflight" \
                  https://api.github.com/user 2>/dev/null); then
              # curl -f makes 4xx/5xx a non-zero exit; re-probe without -f to read the
              # status (a 401 here is a real finding, not a transport error).
              status=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${value}" \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: pat-expiry-preflight" \
                https://api.github.com/user 2>/dev/null || echo "000")
              if [ "${status}" = "000" ]; then
                echo "::warning::${name}: api.github.com unreachable — liveness check skipped"
                return 0
              fi
              # Already-dead token: file the issue AND fail the job (red). INVALID is a
              # job-level flag; we keep going so every secret is reported in one run.
              alert "${name}" "is invalid or expired (api.github.com returned HTTP ${status})"
              echo "::error::${name} is invalid or expired (HTTP ${status}) — rotate it"
              INVALID=1
              return 0
            fi

            expiry=$(printf '%s' "${headers}" | tr -d '\r' \
              | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
            if [ -z "${expiry}" ]; then
              echo "::notice::${name}: valid, no expiry set"
              return 0
            fi

            local exp_epoch now_epoch days_left
            exp_epoch=$(date -u -d "${expiry}" +%s 2>/dev/null || echo 0)
            if [ "${exp_epoch}" -eq 0 ]; then
              echo "::warning::${name}: valid, but could not parse expiry '${expiry}'"
              return 0
            fi
            now_epoch=$(date -u +%s)
            days_left=$(( (exp_epoch - now_epoch) / 86400 ))
            if [ "${days_left}" -le "${WARN_DAYS}" ]; then
              alert "${name}" "expires in ${days_left} day(s) (${expiry}) — within the ${WARN_DAYS}-day threshold"
            else
              echo "::notice::${name}: valid, expires in ${days_left} day(s) (${expiry})"
            fi
          }

          # check_pr_capability NAME VALUE — verify the PAT can OPEN pull requests
          # (release-please's final step), without creating one. Liveness (GET /user)
          # passes for a token that authenticates but lacks 'Pull requests: write' —
          # exactly how a rotated RELEASE_TOKEN silently broke release-please: every
          # push went red with 403 "Resource not accessible by personal access token"
          # on POST /pulls, while this preflight stayed green because the token was
          # still alive. Probe: POST /pulls with a non-existent head branch. GitHub
          # authorizes BEFORE validating the body, so a permitted token reaches
          # validation (HTTP 422) and a forbidden one is rejected at authz (HTTP 403).
          # Nothing is ever created (the head ref does not exist).
          check_pr_capability() {
            local name="$1" value="$2"
            [ -z "${value}" ] && return 0  # empty/offline already handled by check_token
            local status
            status=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${value}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: pat-expiry-preflight" \
              "https://api.github.com/repos/${GH_REPO}/pulls" \
              -d '{"title":"pat-capability-probe","head":"pat-expiry-capability-probe-DO-NOT-CREATE","base":"main"}' \
              2>/dev/null || echo "000")
            case "${status}" in
              422|201) echo "::notice::${name}: can open pull requests (Pull requests: write present)";;
              403)
                alert "${name}" \
                  "authenticates but cannot open pull requests (HTTP 403 on POST /pulls) — release-please cannot create its release PR, so every release is silently blocked" \
                  "**Grant the permission** (this is a scope gap, not expiry — the token value is unchanged, so no re-sync is needed): on the fine-grained PAT backing \`${name}\`, set **Repository permissions → Pull requests → Read and write** (keep **Contents → Read and write**). For a classic PAT, ensure the full **\`repo\`** scope."
                echo "::error::${name} lacks 'Pull requests: write' — release-please cannot open the release PR"
                INVALID=1
                ;;
              000) echo "::warning::${name}: api.github.com unreachable — PR-capability check skipped";;
              *)   echo "::warning::${name}: unexpected HTTP ${status} on PR-capability probe — not failing the job on it";;
            esac
          }

          # INVALID flips to 1 inside check_token when a token is already dead. An
          # expiring-soon (still-valid) token does not flip it — that stays a soft issue.
          INVALID=0
          check_token "RELEASE_TOKEN" "${RELEASE_TOKEN}"
          check_token "BITACORA_PAT" "${BITACORA_PAT}"
          # RELEASE_TOKEN's job is to open release-please's PR — assert that capability,
          # not just that it authenticates (the gap that broke releases). BITACORA_PAT
          # drives a Projects v2 board, a different capability not probed here.
          check_pr_capability "RELEASE_TOKEN" "${RELEASE_TOKEN}"

          if [ "${INVALID}" -ne 0 ]; then
            echo "::error::one or more PAT-backed Actions secrets are invalid/expired or under-scoped — see the pat-expiry issue(s)"
            exit 1
          fi
