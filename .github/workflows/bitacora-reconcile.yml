name: Reconcile bitácora

# OPS-023 (#809). The event-driven add (add-to-project.yml) soft-fails when the
# primary GraphQL pool is exhausted, because that pool is billed per ACCOUNT and
# an interactive session can drain it for up to an hour. That is the right call
# in the moment — but it leaves the item off the board, and a missing ticket is
# indistinguishable from one that was never filed.
#
# This is the healer. `bitacora-rollout.sh --backfill-only` ensures every OPEN
# issue and PR is on the board; `gh project item-add` returns the existing item
# when the content is already there, so a run that finds nothing wrong is a
# no-op. Provisioning (linking, secrets, pushing workflow files) is deliberately
# NOT in scope — this job only adds board items.
#
# Daily, not weekly: five drops were confirmed in three days, and an item off the
# board is invisible while it waits.
#
# Loudness is asymmetric on purpose. Healed drift is a `::notice::` count — it is
# the system working, not an incident. A reconciler that cannot RUN is different:
# it is the backstop failing silently, the exact class of fault this ticket
# exists to remove, so it opens a deduplicated labelled issue and goes red,
# mirroring pat-expiry.yml (OPS-009).

on:
  schedule:
    - cron: '43 4 * * *' # 04:43 UTC daily — off-peak, clear of the release and pat-expiry crons
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space-separated repo names (empty = every non-archived, non-fork repo)'
        required: false
        default: ''

permissions:
  issues: write

concurrency:
  group: bitacora-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reconcile the board
        env:
          # BITACORA_PAT, not GITHUB_TOKEN: Projects v2 writes need the classic
          # scopes the default token does not carry.
          GH_TOKEN: ${{ secrets.BITACORA_PAT }}
          GH_REPO: ${{ github.repository }}
          TARGET_REPOS: ${{ github.event.inputs.repos || '' }}
        # A ONE-LINE invocation on purpose. Actions runs this as `bash -e {0}`,
        # so the injected -e governs exactly this call, where exit 0/1 already
        # means green/red. The classification lives in the script, where -e
        # cannot make it unreachable and a test can execute it (BUG-063).
        run: ./scripts/bitacora-reconcile.sh
