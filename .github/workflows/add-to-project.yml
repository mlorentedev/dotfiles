name: Add to bitácora

# Puts every opened/reopened issue and PR onto the cross-repo bitácora board
# (GitHub Project #1). Pairs with bitacora-status.yml (which flips an assigned
# issue to In Progress). Canonical copy for the OPS-002 (#258) multi-repo rollout.

# Note: actions/add-to-project@v1 only supports issues, not PRs. We use it for
# issues and fall back to gh project item-add for PRs.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # Fork PRs run without repository secrets — BITACORA_PAT would be empty and the
    # job would fail (Codex review on kubelab#237). Skip them; fork PRs reach the
    # board via the rollout backfill or a manual item-add.
    if: github.event_name == 'issues' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      # Issues: use the official action (works fine for issues)
      - name: Add issue to project
        if: github.event_name == 'issues'
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/mlorentedev/projects/1
          github-token: ${{ secrets.BITACORA_PAT }}

      # PRs: use gh CLI directly (the action doesn't support PRs)
      - name: Add PR to project
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.BITACORA_PAT }}
        run: |
          # Get the project ID
          PROJECT_ID=$(gh api graphql -f query='
            query { user(login: "mlorentedev") { projectV2(number: 1) { id } } }
          ' --jq '.data.user.projectV2.id')
          # Get the PR node ID
          PR_NODE_ID=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json id --jq '.id')
          if [ -z "$PROJECT_ID" ] || [ -z "$PR_NODE_ID" ]; then
            echo "Failed to resolve project ID or PR node ID"
            echo "PROJECT_ID=$PROJECT_ID PR_NODE_ID=$PR_NODE_ID"
            exit 1
          fi
          # Add the PR to the project
          gh api graphql -f query='
            mutation($project: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $contentId}) {
                item { id }
              }
            }
          ' -f project="$PROJECT_ID" -f contentId="$PR_NODE_ID"
