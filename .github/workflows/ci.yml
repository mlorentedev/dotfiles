name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts syntax
        run: |
          for script in scripts/*.sh setup-linux.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check for shellcheck issues (scripts/)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: error

      - name: Check for shellcheck issues (root scripts)
        run: |
          shellcheck --severity=error setup-linux.sh

  lint-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = @(
            'setup-windows.ps1',
            'scripts/init-project.ps1',
            'scripts/knowledge-crystallize.ps1',
            'powershell/profile.ps1'
          )
          $failed = $false
          foreach ($script in $scripts) {
            Write-Host "Analyzing $script..." -ForegroundColor Cyan
            $results = Invoke-ScriptAnalyzer -Path $script -Settings .PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
            if ($results) {
              $results | Format-Table -AutoSize
              $failed = $true
            } else {
              Write-Host "  No issues found." -ForegroundColor Green
            }
          }
          if ($failed) { exit 1 }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age zsh

      - name: Install bats-core
        run: |
          source versions.conf
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          sudo "bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf bats.tar.gz "bats-core-${BATS_VERSION}"
          bats --version

      - name: Setup mock environment
        run: |
          mkdir -p ~/.dotfiles/sensitive ~/.dotfiles/scripts ~/.config/age
          age-keygen -o ~/.config/age/key.txt 2>/dev/null

          cp versions.conf ~/.dotfiles/
          cp -r scripts/* ~/.dotfiles/scripts/
          cp -r sensitive/* ~/.dotfiles/sensitive/ 2>/dev/null || true

          ln -sf ~/.dotfiles/.zshrc ~/.zshrc 2>/dev/null || true
          ln -sf ~/.dotfiles/.bashrc ~/.bashrc 2>/dev/null || true

      - name: Run bats test suite
        run: |
          bats tests/*.bats

  integration:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Extract BATS_VERSION from versions.conf
        id: versions
        run: |
          source versions.conf
          echo "BATS_VERSION=$BATS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build integration test container
        run: |
          docker build \
            --build-arg BATS_VERSION=${{ steps.versions.outputs.BATS_VERSION }} \
            -f tests/Dockerfile.integration \
            -t dotfiles-integration-test .

      - name: Run integration tests
        run: |
          docker run --rm dotfiles-integration-test
