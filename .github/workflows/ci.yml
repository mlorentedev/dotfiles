name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Validate shell scripts syntax
        run: |
          for script in scripts/*.sh setup-linux.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check for shellcheck issues (scripts/)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          severity: error

      - name: Check for shellcheck issues (root scripts)
        run: |
          shellcheck --severity=error setup-linux.sh

      - name: Verify skill records render cleanly, offline (SDD-008)
        run: |
          ./scripts/compile-harness.sh --check

      - name: Lint bats @test names (no silent-skipped tests)
        run: |
          ./scripts/check-bats-names.sh tests/

  lint-powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = @(
            'setup-windows.ps1',
            'scripts/knowledge-crystallize.ps1',
            'scripts/obs-cli.ps1',
            'powershell/profile.ps1'
          )
          $failed = $false
          foreach ($script in $scripts) {
            Write-Host "Analyzing $script..." -ForegroundColor Cyan
            $results = Invoke-ScriptAnalyzer -Path $script -Settings .PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
            if ($results) {
              $results | Format-Table -AutoSize
              $failed = $true
            } else {
              Write-Host "  No issues found." -ForegroundColor Green
            }
          }
          if ($failed) { exit 1 }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # the bats suite runs in ~3 min; a ceiling, not a budget
    steps:
      - uses: actions/checkout@v7

      # age comes from the pinned release, not apt — the same reasoning the
      # Windows job below already applies (BUG-025), arrived at here for a second
      # reason as well.
      #
      # 1. It did not honour the pin. versions.conf says AGE_VERSION=1.3.1;
      #    `apt-get install age` on ubuntu-24.04 gives 1.1.1, so the Linux suite
      #    had never once exercised the version this repo declares — for the tool
      #    that decrypts every secret. Windows tested 1.3.1 and Linux tested
      #    1.1.1, from one line of the same manifest.
      # 2. It was slow and getting slower, because it depends on an Ubuntu
      #    mirror's throughput on the day. Measured 2026-08-18 on one PR: the
      #    step took 10s, then 66s, then over three minutes on consecutive runs.
      #    `Fetched 6615 kB in 39s (168 kB/s)` — the packages, not the work.
      #    GitHub's release CDN is not that mirror.
      #
      # zsh still needs apt (not present on the runner image), so `update` stays
      # for it — but it no longer gates the tool the secrets tests depend on.
      - name: Install age (pinned release — honours AGE_VERSION, as Windows does)
        run: |
          # `. ./versions.conf`, never `. versions.conf`: a slashless argument to
          # the source builtin is searched on $PATH only. bash falls back to the
          # cwd and zsh does not, so the bare form silently yields an empty
          # version and installs `@v`. Prohibited-pattern table, .claude/CLAUDE.md.
          . ./versions.conf
          [ -n "${AGE_VERSION:-}" ] || { echo "AGE_VERSION missing from versions.conf" >&2; exit 1; }
          url="https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" | tar xz
          sudo install -m0755 age/age age/age-keygen /usr/local/bin/
          rm -rf age
          # Fail loudly here if the pin and the binary disagree, rather than
          # letting the suite report on a version nobody asked for. This is the
          # assertion whose absence let 1.1.1 run for months.
          # Compare with a leading `v` stripped from BOTH sides: age prints
          # `v1.3.1` but 1.2.1 printed `1.2.1`, so pinning the prefix would turn
          # a correct install red the next time upstream changes its mind about
          # it. The version is the claim; the `v` is punctuation.
          got="$(age --version | sed 's/^v//')"
          [ "$got" = "${AGE_VERSION#v}" ] || { echo "age is $got, expected ${AGE_VERSION#v}" >&2; exit 1; }
          age-keygen --version >/dev/null

      - name: Install zsh
        # Bounded on purpose. The Azure Ubuntu mirror intermittently stops
        # answering — visible in the log as `Ign: http://azure.archive.ubuntu.com`
        # — and an unbounded `apt-get update` then sits in silence until a human
        # notices and cancels the run. Measured 2026-08-19 on run 32223603170:
        # last output 06:30:08, cancelled by hand at 06:38:22. Eight minutes of
        # nothing, and it had happened before.
        #
        # These options do not make the mirror work. They make its failure LOUD
        # and quick — roughly 45s and a real error — instead of a hang that looks
        # identical to slow progress.
        #
        # The step carries its own ceiling, and that is the load-bearing part. The
        # first attempt at this bounded apt with apt's OWN options and still hung
        # for 16 minutes: `Acquire::http::Timeout` is per-SCHEME and does not cover
        # https, while the mirror it actually stalls on is
        # `https://archive.ubuntu.com`. Bounding the step needs no knowledge of
        # apt's option surface at all — it ends whatever apt is doing, whichever
        # transport it is doing it over.
        timeout-minutes: 3
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15
          sudo apt-get install -y --no-install-recommends zsh

      # tests/knowledge-crystallize-go-parity.bats proves `dotf vault crystallize`
      # is byte-identical to the shell oracle on the golden corpus (CLI-021). It
      # SKIPS when the Go toolchain is absent, and a skipped parity check is a
      # green suite that proves nothing -- the same shape as BUG-055 and #807. The
      # runner's preinstalled Go is not pinned to cli/go.mod, so set it up here.
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # tests/precommit-fallback-real.bats runs the REAL pre-commit through a real
      # `git commit` (BUG-055). It skips when the binary is absent, so without this
      # step the one check that exercises upstream's actual behaviour would skip
      # here and the suite would go green on the stubbed cases alone -- which is
      # exactly how BUG-055 shipped.
      - name: Install pre-commit
        run: |
          pipx install pre-commit || pip install --user pre-commit
          pre-commit --version

      - name: Install bats-core
        run: |
          source versions.conf
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          sudo "bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf bats.tar.gz "bats-core-${BATS_VERSION}"
          bats --version

      - name: Setup mock environment
        run: |
          mkdir -p ~/.dotfiles/sensitive ~/.dotfiles/scripts ~/.config/age
          age-keygen -o ~/.config/age/key.txt 2>/dev/null

          cp versions.conf ~/.dotfiles/
          cp -r scripts/* ~/.dotfiles/scripts/
          cp -r sensitive/* ~/.dotfiles/sensitive/ 2>/dev/null || true

          ln -sf ~/.dotfiles/.zshrc ~/.zshrc 2>/dev/null || true
          ln -sf ~/.dotfiles/.bashrc ~/.bashrc 2>/dev/null || true

      - name: Run bats test suite
        env:
          # tests/spec-gate-pr-real.bats drives the REAL `gh`, and an
          # unauthenticated gh exits at the auth check before it validates
          # --json field names -- so without a token that suite would assert
          # nothing and still go green. Deliberately NOT named GH_TOKEN: only
          # that suite reads this, so no other suite's auth state changes and
          # none of them can start making real API calls. It buys no API access
          # either -- with a token present, field validation and repo resolution
          # both resolve offline. Same intent as the setup-go and pre-commit
          # steps above: make sure the real-dependency checks cannot skip here.
          DOTF_TEST_GH_TOKEN: ${{ github.token }}
        run: |
          bats tests/*.bats

  # WIN-004 (#125): execute the Windows deployment end-to-end. Every
  # Windows-only bug since SDD-002 (BUG-005/020/021/022) escaped the
  # ubuntu-only CI because PSScriptAnalyzer is static analysis, not execution.
  # PR-only: windows-latest minutes bill 2x Linux (proposal R4).
  # Sandbox strategy: re-encrypt the one secret consumed by {env:} tokens with
  # a throwaway age key so the SDD-009 substitution path runs for real, and
  # mock only the vault surface that setup-windows.ps1's auto-memory junction
  # and obsidian-CLI paths consume.
  test-windows:
    runs-on: windows-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Deterministic age install. `choco install age.portable` reported success
      # but intermittently left age-keygen unresolvable on PATH in the next step
      # (chocolatey shim/PATH propagation flake), false-reddening unrelated PRs
      # (BUG-025; sibling of the eza flake BUG-024/#414). Fetch the pinned
      # official release instead, wire it onto PATH explicitly, and verify both
      # binaries resolve here so a layout change fails loudly at install time —
      # not as a cryptic "age-keygen not recognized" downstream.
      - name: Install age (deterministic release + registry PATH — BUG-025)
        shell: pwsh
        run: |
          $ver = ((Get-Content versions.conf | Select-String '^AGE_VERSION=').Line -split '=', 2)[1]
          if (-not $ver) { throw "AGE_VERSION missing from versions.conf" }
          $ver = $ver.Trim()
          $url = "https://github.com/FiloSottile/age/releases/download/v$ver/age-v$ver-windows-amd64.zip"
          $dest = "$env:USERPROFILE\age-dist"
          Invoke-WebRequest -Uri $url -OutFile age.zip
          Expand-Archive -Path age.zip -DestinationPath $dest -Force
          $ageDir = Join-Path $dest 'age'
          Add-Content $env:GITHUB_PATH $ageDir
          # setup-windows.ps1 rebuilds $env:PATH from the Machine+User registry
          # (dropping process-level $GITHUB_PATH additions), so age must ALSO live
          # on the registry PATH or load-secrets.ps1 silently returns without
          # exporting NAN_API_KEY — leaving pi's models.json {env:...} placeholder
          # unresolved at deploy time. choco's age went onto the Machine PATH and
          # survived that rebuild; this restores the property via the User PATH.
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if ($userPath -notlike "*$ageDir*") {
            [Environment]::SetEnvironmentVariable('PATH', "$userPath;$ageDir", 'User')
          }
          # Guard the guard: fail here if the binaries are not where we expect.
          & (Join-Path $ageDir 'age.exe') --version
          & (Join-Path $ageDir 'age-keygen.exe') --version

      - name: Sandbox secrets + minimal vault
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.config\age" | Out-Null
          age-keygen -o "$env:USERPROFILE\.config\age\key.txt"
          $pub = (Select-String "$env:USERPROFILE\.config\age\key.txt" -Pattern 'age1[0-9a-z]+').Matches.Value | Select-Object -First 1
          'ci-dummy-nan-key' | age -r $pub -o sensitive\nan.api-key.secret.age
          # Minimal vault tree so setup-windows.ps1's "Deploy auto-memory
          # junctions from vault" block (gated on Test-Path $VaultRoot) is
          # exercised end-to-end on the runner.
          $vault = "$env:USERPROFILE\Projects\knowledge"
          foreach ($d in '00_meta', '10_projects', '40_resources', '.obsidian') {
            New-Item -ItemType Directory -Force (Join-Path $vault $d) | Out-Null
          }
          '{}' | Set-Content (Join-Path $vault '.obsidian\types.json') -Encoding UTF8
          # Stub obsidian CLI so setup-windows.ps1's Get-Command obsidian check
          # takes the "already installed" path instead of an npm global install.
          $stub = "$env:USERPROFILE\ci-stub-bin"
          New-Item -ItemType Directory -Force $stub | Out-Null
          Set-Content (Join-Path $stub 'obsidian.cmd') '@echo off'
          Add-Content $env:GITHUB_PATH $stub

      # Deliberately Windows PowerShell 5.1 so the BUG-005 pwsh re-exec path
      # is exercised in CI, not just direct-pwsh invocation (proposal R2).
      # Both vars point at the checkout: `dotf secrets render` derives the
      # registry path from DOTFILES_DIR, and the BUG-021 pre-export
      # derives the repo root from DOTFILES_REPO_DIR -- its default assumes
      # ~\Projects\dotfiles, which does not exist on a runner.
      - name: Run setup-windows.ps1 end-to-end (PS 5.1 -> BUG-005 re-exec)
        shell: powershell
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          DOTFILES_REPO_DIR: ${{ github.workspace }}
        run: .\setup-windows.ps1

      - name: Run Pester suites
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path tests -CI

      - name: Run PowerShell bats subset (Git Bash, pinned bats)
        shell: bash
        run: |
          source versions.conf
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          bash "bats-core-${BATS_VERSION}/install.sh" "$HOME/.local"
          "$HOME/.local/bin/bats" \
            tests/powershell-profile.bats \
            tests/profile-heal-ps1.bats \
            tests/setup-windows.bats \
            tests/knowledge-crystallize-ps1.bats \
            tests/obs-cli-ps1.bats

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Extract BATS_VERSION from versions.conf
        id: versions
        run: |
          source versions.conf
          echo "BATS_VERSION=$BATS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build integration test container
        run: |
          docker build \
            --build-arg BATS_VERSION=${{ steps.versions.outputs.BATS_VERSION }} \
            -f tests/Dockerfile.integration \
            -t dotfiles-integration-test .

      - name: Run integration tests
        run: |
          docker run --rm dotfiles-integration-test
