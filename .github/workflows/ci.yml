name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      powershell: ${{ steps.filter.outputs.powershell }}
      # CI-002 (#1478): the first filter that is narrower than "is this code at
      # all". HARNESS-041 asked whether a diff needs CI; this asks which PART of
      # CI a diff needs, which one bucket cannot answer.
      pi: ${{ steps.filter.outputs.pi }}
      pi_nan: ${{ steps.filter.outputs.pi_nan }}
      # #2021: the only diffs on which the PR-Agent upstream contract can drift.
      pr_agent_contract: ${{ steps.filter.outputs.pr_agent_contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'ai/**'
              - 'cli/**'
              - 'scripts/**'
              - 'powershell/**'
              - 'windows/**'
              - 'sensitive/**'
              - '.zsh/**'
              - '.bash/**'
              - '.zshrc'
              - '.bashrc'
              - '.profile'
              - 'git/**'
              - 'tmux.conf'
              - '.inputrc'
              - '.editorconfig'
              - 'setup-linux.sh'
              - 'setup-windows.ps1'
              - 'tests/**'
              - '.github/**'
              - 'git-hooks/**'
              - 'harness/**'
              - 'versions.conf'
              - 'packages.json'
              - 'mcp-servers.json'
              - '.PSScriptAnalyzerSettings.psd1'
              - '.golangci.yml'
              - '.pre-commit-config.yaml'
              # Read by the suite or deployed by setup, so not docs even though
              # none of them is code (HARNESS-041 round 1: six PRs touching only
              # secrets/registry.yaml skipped every test that reads it).
              # tests/ci-path-filtering.bats fails when a new top-level entry
              # is in neither this list nor its docs-only list. On a PR that
              # adds only such an entry that test is itself skipped, so the
              # failure shows on the push to main (#1879).
              - 'secrets/**'
              - 'ssh/**'
              - 'systemd/**'
              - 'forge/**'
              - '.claude/**'
              - 'AGENTS.md'
              - 'install.sh'
              - 'install.ps1'
              - 'env-contract.json'
              - 'machine.json.example'
              - 'session-start-config.json'
              - '.gitattributes'
              - '.gitignore'
              - '.pr_agent.toml'
              - '.geminiignore'
              - '.bashrc.local.example'
              - '.zshrc.local.example'
            powershell:
              - '**/*.ps1'
              - '**/*.psm1'
              - '.PSScriptAnalyzerSettings.psd1'
              - '.github/workflows/ci.yml'
              # PSSCRIPTANALYZER_VERSION: a bump must lint on its own PR (#2052).
              - 'versions.conf'
            # What can change what the pi package reconcile DOES. This set is
            # MAINTAINED BY HAND and is not proven closed — an earlier version
            # of this comment claimed "nothing else can", and that claim is
            # exactly what stopped `versions.conf` being noticed. Under-matching
            # here is silent: the PR still runs test-windows, it just runs it
            # with the reconcile skipped, and it goes green.
            #
            # - ai/pi/**        the manifest and the deployed configs
            # - setup-*.{sh,ps1} the code that reads them, listed WHOLE because
            #                   a filter cannot see line ranges
            # - versions.conf   PI_VERSION selects the pi binary that PERFORMS
            #                   the reconcile (setup-linux.sh:722,
            #                   setup-windows.ps1:1148). A version bump is the
            #                   PR class that most needs nine real installs run
            #                   by the NEW pi, and it was the one class that
            #                   would have skipped them.
            pi:
              - 'ai/pi/**'
              - 'setup-linux.sh'
              - 'setup-windows.ps1'
              - 'versions.conf'
              - 'tests/pi-*.bats'
              - 'cli/internal/pi/**'
              - 'cli/internal/cmd/pi.go'
            # What the pi-nan-package job reads (AI-046): the package pin and
            # the files that name NaN models. Kept apart from `pi` so an
            # opencode or reviewer-pool edit does not re-run nine Windows
            # installs.
            pi_nan:
              - 'ai/pi/**'
              - 'ai/opencode/opencode.jsonc'
              - 'harness/reviewer-pool.json'
              - 'versions.conf'
              - 'tests/pi-nan-package.bats'
              - '.github/workflows/ci.yml'
            pr_agent_contract:
              - '.github/workflows/pr-agent.yml'
              - 'harness/pr-agent-upstream-contract.json'
              - 'tests/pr-agent-config.bats'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate shell scripts syntax
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          for script in scripts/*.sh setup-linux.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check for shellcheck issues (scripts/)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'
          severity: error

      - name: Check for shellcheck issues (root scripts)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          shellcheck --severity=error setup-linux.sh

      - name: Verify skill records render cleanly, offline (SDD-008)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          ./scripts/compile-harness.sh --check

      - name: Lint bats @test names (no silent-skipped tests)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          ./scripts/check-bats-names.sh tests/

      - name: Verify referenced doc paths exist (BUG-088)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          ./scripts/check-doc-paths.sh

      # ADR-020 section 5 enforcement (CLI-072 / #1460). The ADR has always said
      # "in the same PR, delete the .sh + .ps1 pair AND their bats/Pester tests",
      # and nothing checked it: OPS-043 and CLI-072 both complied because the
      # agent remembered, which is not a mechanism.
      #
      # pull_request only, because the rule's unit is the PR's diff against its
      # base. On push there is no base to diff against and the check would either
      # be vacuous or wrong. And only when the diff touches code: retiring a
      # twin deletes a script, which the `code` filter matches.
      - name: Verify a retired twin took its bats/Pester tests with it
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The three-dot diff needs the merge-base, which the default shallow
          # checkout cannot reach -- the same constraint spec-gate documents
          # (#686/C3). Unshallow when shallow, plain fetch otherwise.
          git fetch --no-tags --prune --unshallow origin "$BASE_REF" 2>/dev/null \
            || git fetch --no-tags --prune origin "$BASE_REF"
          ./scripts/check-twin-test-retirement.sh --base "origin/$BASE_REF"

  lint-powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # #2052: this job is the ONE owner of PowerShell lint; the bats tests that
      # re-linted three files (and passed when the module could not load) are
      # gone. The version is pinned in versions.conf. The runner image ships a
      # PSScriptAnalyzer, so it is used when it is the pin and installed only
      # when it is not: `Install-Module -Force` reinstalled it on every run and
      # one Gallery blip failed the job before any file was analyzed.
      - name: Install the pinned PSScriptAnalyzer
        if: github.event_name == 'push' || needs.changes.outputs.powershell == 'true'
        shell: pwsh
        run: |
          $v = ((Get-Content versions.conf | Select-String '^PSSCRIPTANALYZER_VERSION=').Line -split '=', 2)[1]
          if (-not $v) { throw "PSSCRIPTANALYZER_VERSION missing from versions.conf" }
          $v = $v.Trim()
          $present = Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq [version]$v }
          if ($present) {
            Write-Output "PSScriptAnalyzer ${v}: present at $($present[0].ModuleBase), not installed"
          } else {
            Write-Output "PSScriptAnalyzer ${v}: not on the image, installing from the PowerShell Gallery"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module PSScriptAnalyzer -RequiredVersion $v -Force -Scope CurrentUser -ErrorAction Stop
                break
              } catch {
                if ($attempt -eq 3) {
                  Write-Output "::error::PSScriptAnalyzer $v could not be installed from the PowerShell Gallery after 3 attempts, so no file was analyzed: $_"
                  exit 1
                }
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
          }
          "PSSCRIPTANALYZER_VERSION=$v" >> $env:GITHUB_ENV

      - name: Run PSScriptAnalyzer
        if: github.event_name == 'push' || needs.changes.outputs.powershell == 'true'
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          $files = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          $failed = $false
          $total = 0
          foreach ($file in $files) {
            $relPath = [System.IO.Path]::GetRelativePath((Get-Location).Path, $file.FullName)
            Write-Host "Analyzing $relPath..." -ForegroundColor Cyan
            $results = Invoke-ScriptAnalyzer -Path $file.FullName -Settings .PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
            if ($results) {
              $results | Format-Table -AutoSize
              $failed = $true
            } else {
              Write-Host "  No issues found." -ForegroundColor Green
            }
            $total++
          }
          Write-Host "Analyzed $total PowerShell files." -ForegroundColor Cyan
          if ($failed) { exit 1 }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # the bats suite runs in ~3 min; a ceiling, not a budget
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install age (pinned release — honours AGE_VERSION, as Windows does)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          . ./versions.conf
          [ -n "${AGE_VERSION:-}" ] || { echo "AGE_VERSION missing from versions.conf" >&2; exit 1; }
          url="https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" | tar xz
          sudo install -m0755 age/age age/age-keygen /usr/local/bin/
          rm -rf age
          got="$(age --version | sed 's/^v//')"
          [ "$got" = "${AGE_VERSION#v}" ] || { echo "age is $got, expected ${AGE_VERSION#v}" >&2; exit 1; }
          age-keygen --version >/dev/null

      - name: Install zsh
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail

          apt_opts='-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15'

          if sudo apt-get install -y --no-install-recommends zsh; then
              echo "zsh installed from the image's package lists; no mirror needed"
              exit 0
          fi

          for attempt in 1 2 3; do
              echo "apt-get update, attempt ${attempt}/3"
              # shellcheck disable=SC2086  # apt_opts is a deliberate word-split list
              if sudo apt-get update $apt_opts; then
                  break
              fi
              [ "$attempt" -lt 3 ] && sleep 10
          done

          sudo apt-get install -y --no-install-recommends zsh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # One `dotf` for every bats file that runs the real binary (CI-012, #2059).
      # Each used to build its own, and three skipped when that build failed, so a
      # compile error in cli/ read as green. A failure here fails the job, and the
      # files read DOTF_BIN (tests/lib/dotf-bin.bash).
      - name: Build dotf once for the bats suite
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        working-directory: cli
        run: |
          go build -o "$RUNNER_TEMP/dotf" ./cmd/dotf
          echo "DOTF_BIN=$RUNNER_TEMP/dotf" >> "$GITHUB_ENV"

      - name: Install pre-commit
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          pipx install pre-commit || pip install --user pre-commit
          pre-commit --version

      - name: Install bats-core
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          source versions.conf
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          sudo "bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf bats.tar.gz "bats-core-${BATS_VERSION}"
          bats --version

      - name: Setup mock environment
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        # One definition for both jobs; it fails the step on a missing key or an
        # empty fixture copy instead of letting the suite skip on it (#2152).
        run: ./scripts/setup-mock-env.sh

      - name: Run bats test suite
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        env:
          DOTF_TEST_GH_TOKEN: ${{ github.token }}
          # The network leg of pr-agent-config.bats (#2021).
          DOTF_TEST_NETWORK: >-
            ${{ (github.event_name == 'push' || needs.changes.outputs.pr_agent_contract == 'true') && '1' || '' }}
        # One process per file, files in parallel (CI-004, #1739): tests in a
        # file share setup_file state, so they stay serial. `--jobs` needs GNU
        # parallel, which the ubuntu runner image ships but nothing here
        # installs, so its absence fails loudly instead of as a bats error.
        # Measured locally, 4 jobs: 250 s serial to 89 s, three identical runs.
        # The flags, the parallel preflight and the CPU count live in
        # scripts/run-bats.sh, shared with the macOS job, where nproc does not exist.
        run: ./scripts/run-bats.sh --report-dir "$RUNNER_TEMP/bats-report"

      # Per-file timing is the baseline a "no file over 30 s" budget (#1744)
      # needs, and CI had none. `!cancelled()` so a red run still leaves its report.
      - name: Upload the bats timing report
        if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.code == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bats-junit
          path: ${{ runner.temp }}/bats-report/report.xml
          if-no-files-found: warn
          retention-days: 14

  # AI-046 (#1764): the NaN model ids belong to @gtrabanco/pi-nan-provider, so
  # the checks that name one run against the installed package. Its own job
  # because it needs a pinned pi, Node 24 (type stripping, for the package's
  # snapshot module) and the network, none of which the bats suite needs.
  pi-nan-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.pi_nan == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install bats-core
        run: |
          . ./versions.conf
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          sudo "bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf bats.tar.gz "bats-core-${BATS_VERSION}"

      - name: Install pi at the version the machines run
        run: |
          . ./versions.conf
          [ -n "${PI_VERSION:-}" ] || { echo "PI_VERSION missing from versions.conf" >&2; exit 1; }
          npm install -g --ignore-scripts --prefix "$RUNNER_TEMP/pi" "@earendil-works/pi-coding-agent@$PI_VERSION"
          "$RUNNER_TEMP/pi/bin/pi" --version

      - name: Check the NaN ids against the package
        run: |
          PI_BIN="$RUNNER_TEMP/pi/bin/pi" PI_NAN_PACKAGE_REQUIRED=1 bats tests/pi-nan-package.bats

  # PLAT-001d (W10, #2013, #1843 E10): the macOS leg. Linux CI cannot see a BSD
  # sed, a bash 3.2 or a missing sha256sum, and every one of them broke a Mac
  # silently while this suite stayed green (docs/lessons, specs/PLAT-001d).
  #
  # NOT REQUIRED yet. It is not in forge/branch-protection.json, on purpose: it
  # becomes required once it has been green on main for a run of pushes (W10's
  # own acceptance criterion). Making it required means moving the job-level
  # `if:` below onto the steps, as `test` does, or a skipped job leaves the
  # required check pending forever; tests/workflow-job-names.bats flags it.
  #
  # Three layers, one suite (never a per-OS copy of a test):
  #   1. OS behaviour that can be injected (doctor's System.GOOS, deploy's goos)
  #      is tested on the one Linux runner, in `test` and cli.yml.
  #   2. THIS job runs what only a real macOS answers, as tagged in the suite
  #      (`# bats file_tags=os-sensitive`): on a pull request just that tier,
  #      on a push to main the whole suite as well, since a required-later job
  #      that has never run the full suite cannot be trusted with it.
  #   3. From-zero install end to end is X1 (#2013), gated on the root
  #      installers; nothing here pretends to be it.
  #
  # The shells are asserted, not assumed: bats runs under /bin/bash 3.2 (a
  # Homebrew bash ahead of it on PATH would make this a second bash 5 run), and
  # zsh must exist because the tagged tests start it themselves.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pins from versions.conf
        id: pins
        run: |
          . ./versions.conf
          for v in PYTHON_VERSION PYYAML_VERSION AGE_VERSION BATS_VERSION; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::$v missing from versions.conf"; exit 1; }
            echo "$v=$val" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The suite reads workflow YAML and a pinned toml with Python (3.11+ for
      # tomllib, PyYAML for the rest). macOS ships 3.9 without either. These
      # are the exact pins a machine gets from mise (#2062). setup-python's
      # manifest lags upstream, so a pin it does not carry yet fails this step
      # loudly; it carried 3.13.16 when that was pinned.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pins.outputs.PYTHON_VERSION }}

      - name: Install the suite's Python dependencies
        env:
          PYYAML_VERSION: ${{ steps.pins.outputs.PYYAML_VERSION }}
        run: python3 -m pip install --quiet "pyyaml==$PYYAML_VERSION" pre-commit

      # Pinned release, as the Linux job does, but for the runner's own arch.
      - name: Install age (pinned release, darwin)
        env:
          AGE_VERSION: ${{ steps.pins.outputs.AGE_VERSION }}
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=amd64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-darwin-${arch}.tar.gz"
          curl -fsSL "$url" | tar xz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 age/age age/age-keygen "$HOME/.local/bin/"
          rm -rf age
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          got="$("$HOME/.local/bin/age" --version | sed 's/^v//')"
          [ "$got" = "${AGE_VERSION#v}" ] || { echo "age is $got, expected ${AGE_VERSION#v}" >&2; exit 1; }

      - name: Install bats-core (pinned)
        env:
          BATS_VERSION: ${{ steps.pins.outputs.BATS_VERSION }}
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          "bats-core-${BATS_VERSION}/install.sh" "$HOME/.local"
          rm -rf bats.tar.gz "bats-core-${BATS_VERSION}"
          "$HOME/.local/bin/bats" --version

      # `bats --jobs` needs GNU parallel, which the macOS image may not ship.
      # scripts/run-bats.sh fails with the same ::error as the Linux job when it
      # is still absent, so a failed install cannot read as a green leg. The
      # install is a workflow step for now; the declaration moves into the
      # package catalog as a system package under #2013 row P5b, which will
      # also feed this step.
      - name: Install GNU parallel
        run: |
          command -v parallel >/dev/null 2>&1 || brew install parallel
          parallel --version | head -n 1

      - name: Setup mock environment
        run: ./scripts/setup-mock-env.sh

      - name: Show the shells under test
        run: |
          command -v zsh >/dev/null 2>&1 || { echo "::error::zsh is missing; the tagged tests start it"; exit 1; }
          zsh --version
          /bin/bash --version | head -n 1

      # Native vet IS the darwin vet on this runner; a GOOS=darwin line would
      # repeat it (#2147 review).
      - name: Go build, vet and test
        working-directory: cli
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # One `dotf` for every bats file that runs the real binary, as in `test`
      # (CI-012, #2059): a build failure fails the job instead of skipping tests,
      # and a missing DOTF_BIN would let each file rebuild its own.
      - name: Build dotf once for the bats suite
        working-directory: cli
        run: |
          go build -o "$RUNNER_TEMP/dotf" ./cmd/dotf
          echo "DOTF_BIN=$RUNNER_TEMP/dotf" >> "$GITHUB_ENV"

      # `/bin` first so bats' `#!/usr/bin/env bash` finds 3.2; run-bats.sh fails
      # the step when it does not, and when no test carries the tag.
      - name: bats, os-sensitive tier (bash 3.2)
        env:
          DOTF_TEST_GH_TOKEN: ${{ github.token }}
        run: PATH="/bin:$PATH" ./scripts/run-bats.sh --expect-bash 3 --filter-tags os-sensitive

      - name: bats, full suite (bash 3.2, main only)
        if: github.event_name == 'push'
        env:
          DOTF_TEST_GH_TOKEN: ${{ github.token }}
          # As `test` sets it on a push: the network leg of pr-agent-config.bats (#2021).
          DOTF_TEST_NETWORK: '1'
        run: PATH="/bin:$PATH" ./scripts/run-bats.sh --expect-bash 3

  test-windows:
    runs-on: windows-latest
    # RUNS ON main TOO, because a required check that accumulates no evidence on
    # the default branch is a latent failure with nowhere to show up until it
    # blocks someone.
    #
    # The job was `skipped` on every push to main — measured, 6 of the last 6 —
    # so "main is green" was never evidence about it, and the only place it
    # genuinely ran was a PR. That is exactly how CI-001 arrived: a job nobody
    # could see degrading until it cancelled two unrelated PRs at the ceiling.
    # `integration`, the other heavy job, already runs on both for this reason.
    #
    # 20 minutes, measured (CI-004, #1739). CI-001 (#1472) raised this to 45 as
    # a loan until the pi package reconcile left the blocking path; CI-002
    # (#1482) did that, and the loan is repaid here.
    #
    # Job duration since 2026-09-05: push n=111, p50 544 s, p99 858 s, max
    # 961 s; pull_request n=198, max 1000 s. The 40 runs after 2026-09-25 peak
    # at 908 s. 1200 s is 20% above the worst run observed.
    #
    # A push still runs the full reconcile, whose cost tracks npm registry
    # latency (24x variance on identical input, CI-003). A slow registry night
    # can cross this ceiling, and that is the signal it exists to give. Raise it
    # only with a run that crossed it and a ticket that names the cause.
    timeout-minutes: 20
    needs: [changes]
    # issues: read is for the doctor gate's spec-issue-state audit, the one step
    # handed GH_TOKEN below. The workflow default grants contents only.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install age (deterministic release + registry PATH — BUG-025)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $ver = ((Get-Content versions.conf | Select-String '^AGE_VERSION=').Line -split '=', 2)[1]
          if (-not $ver) { throw "AGE_VERSION missing from versions.conf" }
          $ver = $ver.Trim()
          $url = "https://github.com/FiloSottile/age/releases/download/v$ver/age-v$ver-windows-amd64.zip"
          $dest = "$env:USERPROFILE\age-dist"
          Invoke-WebRequest -Uri $url -OutFile age.zip
          Expand-Archive -Path age.zip -DestinationPath $dest -Force
          $ageDir = Join-Path $dest 'age'
          Add-Content $env:GITHUB_PATH $ageDir
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if ($userPath -notlike "*$ageDir*") {
            [Environment]::SetEnvironmentVariable('PATH', "$userPath;$ageDir", 'User')
          }
          & (Join-Path $ageDir 'age.exe') --version
          & (Join-Path $ageDir 'age-keygen.exe') --version

      - name: Sandbox secrets + minimal vault
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.config\age" | Out-Null
          # A native command's failure does not stop a pwsh step, so a broken
          # age-keygen used to leave no key and the suite skipped on it (#2152,
          # the Windows half). Assert what the step promises.
          $key = "$env:USERPROFILE\.config\age\key.txt"
          age-keygen -o $key
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::age-keygen exited $LASTEXITCODE"; exit 1 }
          if (-not ((Test-Path $key) -and (Get-Item $key).Length -gt 0)) { Write-Output "::error::age-keygen left no key at $key"; exit 1 }
          # No per-secret blob is planted: NAN_API_KEY is bw-backed, and doctor
          # FAILs any blob the registry does not claim (CLI-036).
          $vault = "$env:USERPROFILE\Projects\knowledge"
          foreach ($d in '00_meta', '10_projects', '40_resources', '.obsidian') {
            New-Item -ItemType Directory -Force (Join-Path $vault $d) | Out-Null
          }
          '{}' | Set-Content (Join-Path $vault '.obsidian\types.json') -Encoding UTF8
          $stub = "$env:USERPROFILE\ci-stub-bin"
          New-Item -ItemType Directory -Force $stub | Out-Null
          Set-Content (Join-Path $stub 'obsidian.cmd') '@echo off'
          Add-Content $env:GITHUB_PATH $stub

      # TEST-003 (#1298): setup installed dotf into ~/.local/bin and never put
      # it on PATH, so every dotf-gated block (deploy, render, tools install,
      # the post-setup doctor) skipped with a warning and the job stayed green
      # over a red box. Build dotf from THIS PR (the released binary lags the
      # tree; the integration container builds from source for the same
      # reason) and make it reachable by effect before setup runs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build dotf from this PR and put ~/.local/bin on PATH (TEST-003)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $bin = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Push-Location cli
          go build -o "$bin\dotf.exe" ./cmd/dotf
          Pop-Location
          Add-Content $env:GITHUB_PATH $bin
          # And the User PATH (as the age step does): setup-windows.ps1 refreshes
          # PATH from the registry after its winget loop, which used to drop a
          # process-only GITHUB_PATH entry -- Install-Dotf then could not see the
          # source build and replaced it with the release (#1308 third run).
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if ($userPath -notlike "*$bin*") { [Environment]::SetEnvironmentVariable('PATH', "$userPath;$bin", 'User') }
          & "$bin\dotf.exe" version

      # CI-010 (#2047): the pinned pi CLI is restored on a pull request instead
      # of reinstalled from npm, which was ~130 s of every PR's run (p50 508 s,
      # 2026-10-07). The install is a function of three inputs and the key names
      # all three: the runner image (node and npm come from it), PI_VERSION and
      # setup-windows.ps1. A PR that changes any of them misses, so the fresh
      # install path runs on exactly the PRs that can break it.
      #
      # On a hit setup takes its existing branch: `pi --version` is checked
      # against the pin. Exact key, no restore-keys, so a stale install never
      # stands in. Only main writes the cache (the save is the job's last step),
      # because a cache saved on a PR ref is invisible to every other PR, and so
      # the cache is always a fresh install from a fully green run. On main the
      # restore is lookup-only: it never downloads, only tells the save whether
      # the key already exists.
      #
      # Only what the install writes is cached: the package (npm nests its deps
      # inside it) and its three shims. Not the prefix, which also holds the
      # image's own globals and the CLIs `dotf tools install` puts there.
      - name: Resolve the pi CLI cache key
        id: picli
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $v = ((Get-Content versions.conf | Select-String '^PI_VERSION=').Line -split '=', 2)[1]
          if (-not $v) { throw "PI_VERSION missing from versions.conf" }
          $prefix = "$(& npm prefix -g)".Trim()
          if (-not $prefix) { throw "npm prefix -g printed nothing" }
          if (-not $env:ImageVersion) { throw "ImageVersion is not set: the cache key cannot name the runner image" }
          "version=$($v.Trim())" >> $env:GITHUB_OUTPUT
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          Write-Output "pi CLI cache: prefix=$prefix image=$env:ImageVersion version=$($v.Trim())"

      - name: Restore the pinned pi CLI (pull requests; a lookup on main)
        id: picli-cache
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ github.event_name == 'push' }}
          path: |
            ${{ steps.picli.outputs.prefix }}\node_modules\@earendil-works\pi-coding-agent
            ${{ steps.picli.outputs.prefix }}\pi
            ${{ steps.picli.outputs.prefix }}\pi.cmd
            ${{ steps.picli.outputs.prefix }}\pi.ps1
          key: pi-cli-${{ runner.os }}-${{ steps.picli.outputs.image }}-${{ steps.picli.outputs.version }}-${{ hashFiles('setup-windows.ps1') }}

      # Install-Dotf leaves a source build (`dotf version` = dev) in place, so
      # the binary built above survives setup. No DOTFILES_DIR override: the
      # deploy dir is the real-box default (~/.dotfiles), so the gate below
      # certifies the tree a real machine reads, not the checkout (#1298 layer 3).
      #
      # THIS STEP IS ~87% OF THE JOB and CI-001 (#1472) does not fix it. Setup
      # reconciles the pi package manifest with one `pi install` per package,
      # serially. Measured 2026-09-04 across four runs, that phase took 883s,
      # 1331s, 2201s and 2269s — the same nine pinned packages every time.
      #
      # THE VARIABLE IS A ~7-MINUTE TIMEOUT, NOT A SLOW PACKAGE. Every
      # observation of that band, across every run:
      #
      #   pi-rewind 421s | pi-rewind 422s | pi-plan-mode 422s
      #   pi-plan-mode 422.0s | pi-effort 421.4s | pi-memory 421.5s
      #   pi-cc-extensions 422.5s
      #
      # Seven observations at 421 ±1s on FIVE DIFFERENT PACKAGES. It lands on
      # whichever install happens to hit it, and how many hit it per run is what
      # moves the phase between 883s and 2201s. So "27 of 30 minutes", "22-23
      # minutes" and "43 minutes" are the same job with a different number of
      # timeouts in it, and any story about a particular package is attaching the
      # constant to the wrong noun.
      #
      # AN NPM-DOWNLOAD CACHE WAS TRIED HERE AND REMOVED. Recorded so it is not
      # re-derived. Keyed on the manifest hash, it restored 325 MB on a confirmed
      # hit in 8s and the phase did not improve — so the time is not on the
      # download leg. It was NOT shown to be harmful: the warm run's 2269s sits
      # alongside a COLD run's 2201s, and two cold runs differ by 2.5x, so the
      # cache's effect is not separable from run-to-run variance. It was removed
      # for buying nothing while costing 325 MB of Actions quota per manifest
      # hash — and for reading like npm caching is handled here, which stops the
      # next person looking.
      #
      # `npm_config_prefer_offline` went with it: it existed only to make that
      # cache decide anything, and against no cache it is a flag with nothing to
      # prefer.
      #
      # Why the timeout cannot be identified from this log: both setup twins
      # discard `pi install`'s stdout AND stderr on the package loop
      # (setup-windows.ps1, setup-linux.sh), so the 422s window is silent by
      # construction. Removing that redirect is task one of the follow-up.
      #
      # CI-002 (#1478) took the reconcile off the PR path, which is why this job
      # is ~8 minutes on a PR that cannot change it. `pi` is the filter above;
      # anything it matches still runs the reconcile in full.
      #
      # PUSHES TO main NEVER SKIP, and the reconcile now runs ONLY there. That is
      # deliberate and it is the whole guard: coverage does not move to a
      # schedule nobody reads. But it does mean main is the only place a
      # reconcile regression can surface, so the guard's value rests entirely on
      # a red main being noticed. Stated out loud because an unread signal is how
      # CI-001 stayed invisible for as long as it did.
      - name: Run setup-windows.ps1 end-to-end (PS 5.1 -> BUG-005 re-exec)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: powershell
        env:
          DOTFILES_REPO_DIR: ${{ github.workspace }}
          DOTFILES_SKIP_PI_PACKAGES: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.pi != 'true') && '1' || '' }}
        run: .\setup-windows.ps1

      # The gate. Setup itself stays non-fatal on doctor (degrade-not-break, C9,
      # asserted by tests/setup-windows.bats); CI is where a red doctor fails.
      # .github/scripts/doctor-gate.ps1 refreshes PATH the way a fresh terminal
      # would (setup appends winget/npm dirs to the User PATH, which a later
      # step does not inherit) and fails on any [FAIL] not listed -- with its
      # owning ticket -- in doctor-gate-known-failures.txt, or on a listed
      # entry that no longer fires (a stale list is a failure too).
      #
      # GH_TOKEN on this step only (CI-004 AC8): without it every gh call in
      # doctor printed "set the GH_TOKEN environment variable" (43 lines in this
      # step: one `not verified` WARN per active spec from spec-issue-state,
      # plus branch-protection), so a spec whose issue had closed could never
      # fail the gate. The setup step keeps no token.
      #
      # With it, an active spec whose issue is closed FAILs here, on main's push
      # run and on every code PR, until the spec is archived. A closing keyword
      # causes that only under a `skip-archive` label: otherwise spec-gate makes
      # that PR archive the spec. A manual close can (SDD-041, #1087). The
      # remedy is `dotf spec archive`, or `--abandoned`, in its own PR. The gate
      # cannot block that PR: its merge ref no longer holds the active spec, and
      # a specs-only diff skips this step.
      - name: Post-setup doctor gate (TEST-003)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        env:
          DOTFILES_REPO_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File .github/scripts/doctor-gate.ps1

      # #1605: the Pester that runs the suite is pinned in versions.conf and
      # cached. It was `Install-Module -MinimumVersion 5.5.0` on every run, so
      # the Gallery's latest of the day was the test runner, one Gallery blip
      # failed the job before any test ran, and the install cost ~20 s a run.
      # Read in pwsh, as AGE_VERSION is: a CRLF checkout would hand bash a `\r`.
      - name: Resolve the Pester pin
        id: pester
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $v = ((Get-Content versions.conf | Select-String '^PESTER_VERSION=').Line -split '=', 2)[1]
          if (-not $v) { throw "PESTER_VERSION missing from versions.conf" }
          "version=$($v.Trim())" >> $env:GITHUB_OUTPUT

      - name: Restore the pinned Pester
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Documents/PowerShell/Modules/Pester/${{ steps.pester.outputs.version }}
          key: pester-${{ runner.os }}-${{ steps.pester.outputs.version }}

      - name: Run Pester suites
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: pwsh
        env:
          PESTER_VERSION: ${{ steps.pester.outputs.version }}
        run: |
          $v = $env:PESTER_VERSION
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]$v })) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module Pester -RequiredVersion $v -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
                break
              } catch {
                if ($attempt -eq 3) {
                  Write-Output "::error::Pester $v could not be installed from the PowerShell Gallery after 3 attempts, so no test ran: $_"
                  exit 1
                }
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
          }
          Import-Module Pester -RequiredVersion $v
          # A later step inherits the runner's original PATH plus GITHUB_PATH only;
          # the winget Links dir and npm's prefix that setup added to the User
          # PATH are invisible here, so every suite gated on an installed tool
          # (copilot-native-skills) computed "absent" at discovery and skipped as
          # green on every run (TEST-006, #1320). Same helper setup uses.
          # Computed in a child pwsh: dot-sourcing utils.ps1 into THIS process
          # would carry its strict mode and helpers into every Pester suite.
          $env:PATH = (pwsh -NoProfile -Command '. ./scripts/utils.ps1; Sync-SessionPath; $env:PATH')
          $env:DOTFILES_CI_EXPECT_COPILOT = '1'
          Invoke-Pester -Path tests -CI

      - name: Run PowerShell bats subset (Git Bash, pinned bats)
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          source versions.conf
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o bats.tar.gz
          tar -xzf bats.tar.gz
          bash "bats-core-${BATS_VERSION}/install.sh" "$HOME/.local"
          "$HOME/.local/bin/bats" \
            tests/powershell-profile.bats \
            tests/profile-heal-ps1.bats \
            tests/setup-windows.bats \
            tests/obs-cli-ps1.bats

      # CI-010: the other half of the restore above. Last, so only a run whose
      # every step passed writes the cache. The first clause is every step's
      # guard (HARNESS-041); the rest narrows it to a miss on main.
      - name: Save the pi CLI that main installed
        if: (github.event_name == 'push' || needs.changes.outputs.code == 'true') && github.event_name == 'push' && steps.picli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.picli.outputs.prefix }}\node_modules\@earendil-works\pi-coding-agent
            ${{ steps.picli.outputs.prefix }}\pi
            ${{ steps.picli.outputs.prefix }}\pi.cmd
            ${{ steps.picli.outputs.prefix }}\pi.ps1
          key: pi-cli-${{ runner.os }}-${{ steps.picli.outputs.image }}-${{ steps.picli.outputs.version }}-${{ hashFiles('setup-windows.ps1') }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract versions from versions.conf
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        id: versions
        run: |
          source versions.conf
          {
            echo "BATS_VERSION=$BATS_VERSION"
            echo "AGE_VERSION=$AGE_VERSION"
            echo "GO_VERSION=$(sed -n 's/^go //p' cli/go.mod)"
          } >> "$GITHUB_OUTPUT"

      - name: Build integration test container
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        env:
          BATS_VERSION: ${{ steps.versions.outputs.BATS_VERSION }}
          AGE_VERSION: ${{ steps.versions.outputs.AGE_VERSION }}
          GO_VERSION: ${{ steps.versions.outputs.GO_VERSION }}
        run: |
          docker build \
            --build-arg BATS_VERSION="$BATS_VERSION" \
            --build-arg AGE_VERSION="$AGE_VERSION" \
            --build-arg GO_VERSION="$GO_VERSION" \
            -f tests/Dockerfile.integration \
            -t dotfiles-integration-test .

      - name: Run integration tests
        if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
        run: |
          docker run --rm dotfiles-integration-test
