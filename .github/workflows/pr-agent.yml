name: pr-agent

# TOOL-013 (#786): an inline PR reviewer backed by NaN cluster inference, so
# review capacity stops being the constraint on throughput.
#
# The problem it removes, measured 2026-08-16: CodeRabbit's free tier allows
# roughly one review per hour ACCOUNT-WIDE. Three PRs opened by three parallel
# sessions each received "Review limit reached" instead of a review, while
# `gh pr checks` reported `CodeRabbit  pass` for all three. Two were merged
# unreviewed. GUARD-002 made that visible; this makes it stop happening.
#
# Runs ALONGSIDE CodeRabbit deliberately, for a bounded window. #786 requires
# recording which tool found what before either is retired, and the standing rule
# caps autonomous reviewers at two.

on:
  pull_request:
    # `synchronize` is here so a fix pushed after a review is read too. It is NOT
    # handled by pr_actions; see handle_push_trigger below.
    #
    # What a push gets is bounded (TOOL-023, ADR-040). A full review on every push
    # (#1053) measured 39 reviews across 18 PRs in one week, up to 7 on one PR.
    # Each was one request to a NaN pool of 5 shared slots, and each re-review
    # reopened the triage queue. A push is now reviewed incrementally, for the
    # commits since the previous review. It runs only once 3 non-merge commits
    # are newer than that review, as the "push gate" step decides. Below that,
    # nothing runs, so nothing reports a review that did not happen: #1053's
    # finding. The field does the same: Copilot and Codex review once,
    # CodeRabbit reviews incrementally and pauses. Iterate on a draft, which this
    # job skips, and mark the PR ready when it is.
    #
    # A burst still collapses: #1042's concurrency group is keyed on the event
    # name with cancel-in-progress, so push-vs-push cancels.
    types: [opened, synchronize, reopened, ready_for_review]
  # Slash commands (/review, /describe, /improve) on an existing PR.
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key, and it is load-bearing. A PR comment is an
  # issue_comment whose `issue.number` IS the PR number, so without it a
  # comment-triggered run shares this group with the in-flight pull_request run and
  # `cancel-in-progress` kills the review. PR-Agent is a Docker action that spends
  # its first ~20s in `Build The-PR-Agent/pr-agent`, and CodeRabbit's auto-summary
  # comment reliably lands inside that window.
  #
  # Measured on #1037 and #1038 (2026-08-18): both reviews cancelled mid-build,
  # both workflows reporting green, zero reviews produced — on every PR since this
  # shipped. Pushes still supersede pushes; a comment no longer cancels a review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the review comments are the product
  issues: write          # slash-command replies land as issue comments

jobs:
  review:
    # issue_comment fires on issues too; and skip draft PRs, which are by
    # definition not asking to be read yet.
    #
    # The issue_comment half is gated on the commenter's association, and that gate
    # is load-bearing rather than defensive. This repository is PUBLIC: any account
    # can comment on a pull request, `issue_comment` runs in the BASE repo context
    # with secrets available, and without this line a stranger typing `/review`
    # spends the inference budget and exercises `pull-requests: write` on demand.
    #
    # The association set is the one the attestation classifier already treats as
    # "belongs to this repository", so membership has one definition here and not two.
    #
    # The release-branch exclusion is HERE, not in `.pr_agent.toml`, and that
    # move is the fix for #1073. The config declared
    # `ignore_pr_source_branches = ["^release-please--"]` and the reviewer went
    # on reviewing release PRs anyway: measured on #1085, whose head ref is
    # `release-please--branches--main` and which carries a `## PR Reviewer Guide`
    # comment posted at 07:36:44. Upstream applies that key on its webhook path;
    # the Action entrypoint takes its settings from the env below, so the line
    # read like a decision and asserted nothing — the same shape as the
    # `synchronize`-in-`pr_actions` trap documented further down.
    #
    # A workflow-level `if` cannot be ignored by the tool it gates. The cost of
    # the old arrangement was not cosmetic: every release PR spent inference
    # budget on a diff that is a mechanical restatement of commits already
    # reviewed when they landed, which is the same reasoning behind the gate's
    # own release-please exemption in harness/review-attestation.json.
    #
    # Only the `pull_request` half is gated. A human typing `/review` on a
    # release PR is asking on purpose, and this must not silently refuse them.
    #
    # This repository is PUBLIC, so the branch name is attacker-chosen: anyone
    # can open a PR from a branch called `release-please--anything` and skip the
    # reviewer. That buys nothing. Skipping the reviewer does not attest a
    # review — `review-attestation` reads `declined`/`pending` and stays red, and
    # the gate's own release exemption is keyed on DIFF SIGNATURE, never on the
    # branch, precisely so a borrowed name cannot satisfy both. Two independent
    # conditions, and this one only ever removes a review; it can never grant one.
    #
    # `head.ref` is read by the expression engine here, never interpolated into a
    # `run:` — the injection concern that normally attaches to it does not apply
    # to an `if`.
    # The Dependabot exclusion is the same shape as the release-please one above
    # and lands for a harder reason: on a Dependabot-triggered run this reviewer
    # CANNOT work. GitHub serves those runs from a separate secrets store, and
    # this repo's is empty (`dependabot/secrets` -> total_count: 0), so
    # `secrets.NAN_API_KEY` expands to "" — LiteLLM cannot authenticate, PR-Agent
    # swallows the failure and exits green, and the guard below then goes red on
    # every weekly PR. Measured 2026-08-24 on #1219/#1220 (HARNESS-080, #1221).
    #
    # Keyed on `github.actor` rather than on the branch, and unlike the
    # release-please line above that choice is load-bearing rather than
    # stylistic: `github.actor` is the SAME field GitHub reads to pick the
    # secrets store, so the skip fires exactly when the credential is missing.
    # A human pushing to a Dependabot branch is a different actor with the
    # secrets present, and gets a real review. `dependabot[bot]` is also
    # unforgeable — GitHub does not permit `[` in a user login — which the
    # attacker-chosen branch name discussed above is not.
    #
    # This removes a review, it can never grant one: `review-attestation` still
    # reads `pending` and the PR still cannot merge until a human reviews it.
    # That is `dependabot.yml`'s stated policy ("every PR is reviewed and merged
    # by a human"), and the classifier already counts a human review
    # (`check-review-attestation.sh`) with `pull_request_review` re-firing the
    # gate. Mirroring NAN_API_KEY into the Dependabot store was the alternative
    # and was rejected: it spends scarce NaN concurrency — 5 requests shared with
    # pi, qq and hive embeddings, see #1107 — on dependency bumps whose verdict a
    # human makes anyway.
    #
    # Only the `pull_request` half is gated, for the same reason as release PRs:
    # a human typing `/review` on a Dependabot PR is asking on purpose, that run
    # is triggered by the human, and its secrets are present.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.fork == false
        && !startsWith(github.event.pull_request.head.ref, 'release-please--')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    # One review at a time in this repository (AI-045 AC10, #1923). NaN limits
    # concurrency per model and per key, shared with pi, qq, hive and the archive
    # gate; parallel PRs reviewed together exhaust the bucket each one needs. On
    # the job, because the workflow-level group above is per PR and cancels in
    # progress, which GitHub refuses beside `queue: max`. Without `queue: max` a
    # group keeps one pending job and a newer one cancels it, so a third PR
    # would lose its review without the publish guard ever running.
    concurrency:
      group: pr-agent-review-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    # At most two bounded PR-Agent attempts, one per provider (12 minutes on NaN,
    # 8 on Anthropic), plus the probes before them, setup, and the two publication
    # measurements and the final guard after them (each up to three API calls with
    # retry sleeps). The second attempt runs only when the first published nothing
    # (AI-045 AC9), so a day without trouble holds the one-at-a-time lane no
    # longer than before.
    timeout-minutes: 31
    steps:
      # `The-PR-Agent/pr-agent`, not `qodo-ai/pr-agent` as #786's body says: the
      # project has been renamed and the old path now redirects. Pinned to a tag
      # that was verified to exist and to carry an `action.yaml` (a Docker
      # action) — the first draft of this file pinned `@v0.30`, which does not
      # exist at all.
      # Captured BEFORE PR-Agent runs so the guard below can bind its verdict to
      # THIS run: with `persistent_comment` PR-Agent edits its earlier Guide, which
      # moves `updated_at`; a Guide left by a previous run and never touched by
      # this one stays older than this stamp and no longer satisfies the guard.
      - name: Stamp run start
        id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # PR-Agent swallows an authentication failure and exits green, so without
      # this step a missing secret surfaces only as "published no review" with a
      # NaN-concurrency diagnosis that is wrong. Measured 2026-09-06 on the ten
      # repositories that received this workflow before their NAN_API_KEY was
      # synced. Fail here, with the remedy, before spending a run on it.
      # `secrets` is not an allowed context in a step `if:` (actionlint: expression),
      # so the presence test travels as a boolean env var; the value never does.
      - name: Fail if the reviewer has no credential
        id: credential
        env:
          HAS_NAN_API_KEY: ${{ secrets.NAN_API_KEY != '' }}
        run: |
          if [ "${HAS_NAN_API_KEY}" != "true" ]; then
            echo "::error::NAN_API_KEY is not set in this repository's Actions secrets, so PR-Agent cannot review."
            echo "::error::Remedy: add ci:${GITHUB_REPOSITORY} to NAN_API_KEY's consumers in" \
              "dotfiles/secrets/registry.yaml, then run: dotf secrets sync ci --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
      # A PR whose every file is in `.pr_agent.toml`'s [ignore] reaches the model
      # as an EMPTY diff. PR-Agent then logs "No PR diff fits the /review request",
      # publishes nothing and exits green, and the guard below reported that as NaN
      # concurrency exhaustion. It is neither transient nor NaN's doing: every DR
      # escrow refresh (only `sensitive/**`, ignored on purpose) failed that way,
      # three runs in a row on #1614 (#1618).
      #
      # So ask first, with PR-Agent's own semantics: upstream's `file_filter.py`
      # turns each glob into `fnmatch.translate(glob)` (plus the glob without a
      # leading `**/`) and drops a file when any pattern `re.match`es it. The
      # config is read from the DEFAULT branch, which is where PR-Agent reads it.
      #
      # Skipping removes a run that could not review anything; it never grants a
      # review. `review-attestation` still reads the PR as unreviewed until
      # CodeRabbit or a human reviews it. Any failure to answer falls through to
      # running PR-Agent, which is the behaviour before this step existed.
      #
      # PR-Agent also drops files by TYPE (`is_valid_file`): its bad_extensions
      # list (`.gitignore`, `.lock`, images) and an exact lockfile list. A
      # `.gitignore`-only PR (#1977) and lockfile-only dependabot bumps hit the
      # same empty diff (#1417). Both lists are read from upstream at PR_AGENT_REF,
      # which a test pins to the action's own SHA, so nothing here is a copy that
      # can drift. If either read fails, that list is empty: the skip narrows and
      # never widens.
      #
      # The same output also skips a PR that was MERGED, CLOSED or turned back
      # into a draft while its run waited in the one-at-a-time lane (`queue: max`
      # above). The run's event is a snapshot from when it was queued, so nothing
      # else notices. Measured 2026-10-07: a merged PR's review held the lane
      # 18 minutes while eight open PRs waited behind it (#1923). A draft gets
      # its review from `ready_for_review`. Only a definite answer skips:
      # if the read fails, the review runs, as before. Only `pull_request`
      # runs skip, because a human typing /review on a merged PR means it.
      - name: Skip when PR-Agent would receive an empty diff
        id: reviewable
        if: steps.credential.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -uo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            pr_state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq 'if .merged then "merged" elif .state == "closed" then "closed" elif .draft then "draft" else "open" end' \
              2>/dev/null) || pr_state=""
            case "$pr_state" in
              merged|closed|draft)
                echo "::notice::PR #${PR_NUMBER} became ${pr_state} while this review waited in the queue; not reviewing it."
                echo "reviewable=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          workflow=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/pr-agent.yml?ref=${WORKFLOW_SHA}" \
            --jq '.content' | base64 -d) || {
              echo "::error::cannot read the executing PR-Agent workflow"
              exit 1
            }
          PR_AGENT_REF=$(printf '%s\n' "$workflow" \
            | sed -n 's|^[[:space:]]*uses: The-PR-Agent/pr-agent@\([0-9a-f]\{40\}\).*|\1|p' | sort -u)
          if [[ ! "$PR_AGENT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the executing workflow must have one pinned PR-Agent action"
            exit 1
          fi
          CFG=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.pr_agent.toml?ref=${DEFAULT_BRANCH}" \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || CFG=""
          upstream() { # $1 = path in The-PR-Agent/pr-agent at PR_AGENT_REF; empty on failure
            gh api "repos/The-PR-Agent/pr-agent/contents/$1?ref=${PR_AGENT_REF}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true
          }
          UPSTREAM_EXT=$(upstream pr_agent/settings/language_extensions.toml)
          UPSTREAM_HANDLER=$(upstream pr_agent/algo/language_handler.py)
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' 2>/dev/null) || FILES=""
          export CFG FILES UPSTREAM_EXT UPSTREAM_HANDLER
          kept=$(python3 - <<'PY'
          import ast, fnmatch, os, re, tomllib
          ignore = tomllib.loads(os.environ["CFG"]).get("ignore", {})
          patterns = list(ignore.get("regex", []) or [])
          for glob in ignore.get("glob", []) or []:
              patterns.append(fnmatch.translate(glob))
              if glob.startswith("**/"):
                  patterns.append(fnmatch.translate(glob[3:]))
          compiled = [re.compile(p) for p in patterns]
          ext = os.environ.get("UPSTREAM_EXT", "")
          bad = {str(e).lower() for e in tomllib.loads(ext).get("bad_extensions", {}).get("default", [])} if ext else set()
          lits = {}  # is_valid_file's literal lockfile set and suffix tuple, by name
          for node in ast.walk(ast.parse(os.environ.get("UPSTREAM_HANDLER", ""))):
              if isinstance(node, ast.Assign) and isinstance(node.targets[0], ast.Name):
                  try:
                      lits[node.targets[0].id] = ast.literal_eval(node.value)
                  except (ValueError, TypeError, SyntaxError):
                      pass
          locks = set(lits.get("auto_generated_files_exact", ()))
          suffixes = tuple(lits.get("auto_generated_suffixes", ()))
          def typed_out(f):  # is_valid_file at PR_AGENT_REF, inverted
              return (f.split("/")[-1] in locks or (bool(suffixes) and f.endswith(suffixes))
                      or f.split(".")[-1].lower() in bad)
          files = [f for f in os.environ["FILES"].splitlines() if f]
          if not files:
              raise SystemExit("no file list")
          print(sum(1 for f in files if not typed_out(f) and not any(r.match(f) for r in compiled)))
          PY
          ) || kept=""
          if [ "$kept" = "0" ]; then
            echo "::notice::every file in this PR is in .pr_agent.toml's [ignore] list or of a type" \
              "PR-Agent never reads (#1417), so PR-Agent" \
              "has nothing it may read; not running it. This is not a review: review-attestation" \
              "still needs CodeRabbit or a human (#1618)."
            echo "reviewable=false" >> "$GITHUB_OUTPUT"
          else
            echo "reviewable=true" >> "$GITHUB_OUTPUT"
          fi
      # The job has no full checkout: only the scripts that decide whether
      # PR-Agent runs (TOOL-023's push gate), on which model (AI-045's
      # preflight and the pool draw), and whether it published (the guard,
      # which also gates the second attempt), plus the pool whose weights the
      # draw reads. They are fetched from the PR's merge ref, the same
      # trust as this workflow file, and forks never reach this job.
      - name: Check out the reviewer's scripts
        if: steps.reviewable.outputs.reviewable != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            harness/reviewer-pool.json
            scripts/pr-agent-push-gate.sh
            scripts/pr-agent-model-preflight.sh
            scripts/pr-agent-route.sh
            scripts/pr-agent-publish-guard.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # TOOL-023: the push gate decides BEFORE PR-Agent starts. A push PR-Agent
      # skipped would publish nothing, and the guard below would read that as a
      # failed inference.
      - name: Decide whether this push is reviewed
        id: push_gate
        if: github.event.action == 'synchronize'
        # Fails OPEN. A read that fails leaves no file, and the gate reviews on
        # unreadable input. A step that fails leaves no output, and PR-Agent
        # runs. A review is skipped only when the data justifies it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          set -o pipefail
          dir=$(mktemp -d)
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -s 'add // []' > "$dir/comments.json" || rm -f "$dir/comments.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate \
            | jq -s 'add // []' > "$dir/commits.json" || rm -f "$dir/commits.json"
          ./scripts/pr-agent-push-gate.sh --comments "$dir/comments.json" \
            --commits "$dir/commits.json" --sender-type "${SENDER_TYPE}" | tee -a "$GITHUB_OUTPUT"
      # AI-045: ask NaN which model of the declared chain answers, BEFORE the
      # review. NaN retired mimo-v2.5 on 2026-09-30. It first hung, so PR-Agent
      # published nothing and the job still went green, then it answered 401.
      # PR-Agent's own fallback catches a refusal but not a hang, and neither
      # case tells anyone the declared model is dead. The script probes each
      # model once, passes on the ones that answer, in declared order, and names
      # every one that did not in a warning and in the job summary. It never
      # admits a model outside the chain; the draw below picks among the rest.
      #
      # The chain is declared HERE, not read from `.pr_agent.toml`, because
      # PR-Agent reads that file from the default branch, so a PR changing the
      # model would still probe the old one. A test holds the two equal.
      #
      # When none answers, NaN is out of the review pool for this run, and the
      # pool's Anthropic member reviews (AI-045 AC9). So the failure does not end
      # the job here; the final guard reports what happened, naming this step.
      - name: Probe the declared NaN chain
        id: models
        if: steps.reviewable.outputs.reviewable != 'false' && steps.push_gate.outputs.run != 'false'
        continue-on-error: true
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          DECLARED_MODEL: openai/mimo-v2.6-flash
          DECLARED_FALLBACK_MODELS: '["openai/deepseek-v4-flash", "openai/glm5.3-flash"]'
        # The exit code travels to the draw: 1 (no NaN model answered) is an
        # outage the pool absorbs, 2 (a broken setup) must stop it.
        # continue-on-error leaves only `outcome`, which is `failure` for both.
        run: |
          rc=0
          ./scripts/pr-agent-model-preflight.sh --model "${DECLARED_MODEL}" \
            --fallbacks "${DECLARED_FALLBACK_MODELS}" --output "$GITHUB_OUTPUT" || rc=$?
          echo "exit=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # AI-045 AC9 (#1923): the CI review pool. Every member that answered its
      # probe (the NaN models above, and Haiku, probed here) is drawn by the
      # `weight` harness/reviewer-pool.json gives it, so each member's share of
      # the reviews is a declared number, and a member that is saturated or dead
      # is simply not in the draw. A PR at or past `pr_agent_risk` (its changed
      # lines, or the label) reviews first on Sonnet instead, when Sonnet
      # answers. One attempt talks to one provider: the other provider is the
      # second attempt, which runs only on a measured absence of a published
      # review. `vars.PR_AGENT_PROVIDER` overrides the draw (draw, nan,
      # anthropic, nan-only); `nan-only` stops all spending on the Anthropic key
      # without a PR. The script's header has the rules, including the
      # allowlist of Anthropic models; the job summary names the member drawn.
      #
      # The size and labels are read here rather than from the event, because
      # an `issue_comment` event carries neither. A failed read leaves them
      # empty: the route then says so, and the label alone can still route.
      - name: Draw the reviewer from the pool
        id: route
        if: >
          !cancelled() && steps.credential.outcome == 'success'
            && steps.reviewable.outcome == 'success'
            && steps.reviewable.outputs.reviewable != 'false'
            && steps.push_gate.outputs.run != 'false'
        env:
          NAN_OUTCOME: ${{ steps.models.outcome }}
          NAN_MODEL: ${{ steps.models.outputs.model }}
          NAN_FALLBACKS: ${{ steps.models.outputs.fallbacks }}
          NAN_PREFLIGHT_EXIT: ${{ steps.models.outputs.exit }}
          # For the probe only; it travels to curl on stdin, never on argv.
          PR_AGENT_ANTHROPIC_API_KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
          PR_AGENT_PROVIDER: ${{ vars.PR_AGENT_PROVIDER }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"); then
            PR_CHANGED_LINES=$(jq -r '.additions + .deletions' <<<"$pr")
            PR_LABELS=$(jq -c '[.labels[].name]' <<<"$pr")
          else
            PR_CHANGED_LINES="" PR_LABELS="[]"
          fi
          export PR_CHANGED_LINES PR_LABELS
          ./scripts/pr-agent-route.sh --output "$GITHUB_OUTPUT"
      # The Anthropic attempt. It appears twice, first and second, because steps
      # cannot be reordered at run time; a test holds the two identical.
      # Everything that shapes its cost is stated here and pinned by tests,
      # because the key it holds pays per token:
      #
      # - The MODEL is the one the draw chose, for `model` and `model_weak`,
      #   with no fallback chain: Haiku when drawn, Sonnet on the risk route.
      #   The API key cannot be restricted to a model in the Claude Console
      #   (workspaces carry spend and rate limits, not an allowlist), so the
      #   allowlist is ALLOWED_ANTHROPIC in scripts/pr-agent-route.sh, which
      #   fails the draw on any other model, and the test that pins it. Haiku
      #   5.5 costs $0.10 / $0.50 per million input / output tokens for prompts
      #   up to 100,000 tokens, and five times that above it; Sonnet 5.5 costs
      #   $2 / $10 with no price step.
      # - The PROMPT is capped at 200,000 tokens (`max_model_tokens`; the
      #   `custom_` twin is needed because PR-Agent's registry does not know the
      #   model), the same as the NaN attempt, so every pool member reviews the
      #   same diff. The owner chose parity over the price step (2026-10-08):
      #   PR-Agent's tokenizer counts about 30% fewer tokens than Claude's, so a
      #   diff past roughly 75,000 of PR-Agent's crosses 100,000 and pays the
      #   higher prices for that request.
      # - The OUTPUT is capped at 32,000 tokens. LiteLLM sends 4,096 for a Claude
      #   model it does not know (DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS), and the
      #   model's thinking counts toward the cap, so a review could be cut short
      #   and published as nothing. Worst case, a 260,000-token prompt with a
      #   full answer, is about $0.21 a review on Haiku and $0.84 on Sonnet.
      # - EFFORT is the member's `reasoning_effort` in the pool (Haiku `high`,
      #   Sonnet `medium`), with adaptive thinking. PR-Agent sends `thinking`
      #   and `output_config` only for a model it recognises as adaptive, and
      #   its built-in pattern does not match these ids, hence the override
      #   list, which names every allowed model. Measured with LiteLLM 1.103.0,
      #   the version PR-Agent v0.47.0 pins: both reach the API unchanged and the
      #   answer carries a thinking block.
      # - TEMPERATURE is never sent: Haiku 5.5 answers 400 to any non-default
      #   value, and PR-Agent sends 0.2 unless the model is listed here. Both
      #   allowed models are listed, so neither depends on accepting it.
      # - The call is not streamed. PR-Agent forces streaming only for an
      #   OpenAI-compatible base URL, and none is set for Anthropic. `ai_timeout`
      #   therefore bounds the whole answer, thinking included, so it is raised
      #   from 120 s to 360 s. The step's 8 minutes bound everything else.
      #
      # Same action, same pin, same github_action_config as the NaN attempt: a
      # test holds the review settings equal, so either provider reviews what
      # the other would have.
      - name: PR-Agent on Anthropic, drawn first
        id: pr_agent_anthropic_first
        if: "!cancelled() && steps.route.outputs.first == 'anthropic'"
        timeout-minutes: 8
        continue-on-error: true
        uses: The-PR-Agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e  # v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The only inference credential this step holds; NaN's is not here.
          ANTHROPIC__KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
          CONFIG__MODEL: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__MODEL_WEAK: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__NO_TEMPERATURE_MODELS: >-
            ["anthropic/claude-haiku-5-5", "claude-haiku-5-5",
            "anthropic/claude-sonnet-5-5", "claude-sonnet-5-5"]
          CONFIG__ENABLE_CLAUDE_ADAPTIVE_THINKING: "true"
          CONFIG__CLAUDE_ADAPTIVE_THINKING_MODELS_OVERRIDE: '["anthropic/claude-haiku-5-5", "anthropic/claude-sonnet-5-5"]'
          CONFIG__REASONING_EFFORT: ${{ steps.route.outputs.anthropic_effort }}
          CONFIG__AI_TIMEOUT: "360"
          DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS: "32000"
          # Below: identical to the NaN attempt's review settings (a test checks it).
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: >-
            ${{ steps.push_gate.outputs.mode == 'incremental' && '["/review -i"]' || '["/review"]' }}
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.fail_on_tool_errors: "true"
      # The NaN attempt, when NaN was drawn first, or when the Anthropic attempt
      # published nothing. The rule that no second Action runs on an ambiguous
      # failure stands, and the probe keeps it by measuring rather than
      # guessing: it asks the final guard's question (a github-actions[bot]
      # comment carrying a declared marker, updated since this run started) and
      # only a definite "no" runs the next attempt. If the first attempt
      # published after the probe looked, `persistent_comment` makes the second
      # EDIT that one Guide rather than add another. `!cancelled()`, not
      # `always()`: a run superseded by a newer push must not spend a second
      # Action on a diff nobody will read.
      - name: Measure whether the Anthropic attempt published
        id: published_after_anthropic
        if: >
          !cancelled() && steps.route.outputs.first == 'anthropic'
            && steps.route.outputs.second == 'nan'
            && (github.event_name == 'pull_request'
              || (github.event_name == 'issue_comment'
                  && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: ./scripts/pr-agent-publish-guard.sh --probe --output "$GITHUB_OUTPUT"
      - name: PR-Agent
        id: pr_agent
        if: >
          !cancelled() && (steps.route.outputs.first == 'nan'
            || steps.published_after_anthropic.outputs.published == 'false')
        # #1913: a bounded attempt. A hang on the primary used to hold the job
        # until its own timeout and publish nothing (run 36805617985), because
        # `ai_timeout` does not fire on a hang (AI-045). 12 minutes covers the
        # slowest review measured on mimo-v2.6-flash (10.5 min, run 36806962325).
        # A tool error or a timeout does not end the job: the probe below
        # measures whether anything was published, the Anthropic attempt runs
        # only on a measured absence, and the final guard reports the outcome of
        # the last attempt that ran. An ambiguous failure never runs a second Action.
        timeout-minutes: 12
        continue-on-error: true
        # Pinned by COMMIT, not by tag. A tag is mutable and belongs to upstream:
        # whoever can move it decides what runs here, and what runs here holds
        # NAN_API_KEY and `pull-requests: write`. This repository is PUBLIC, so that
        # is not a theoretical actor. Verify a bump against the API rather than
        # trusting the annotation, with <tag> the trailing `# vX.Y.Z`:
        # `gh api repos/The-PR-Agent/pr-agent/git/ref/tags/<tag>` must return this
        # sha (an annotated tag returns a tag object: dereference it via git/tags).
        # The tag is not repeated here because Dependabot rewrites only the line
        # below, and a copy in this comment drifted from v0.42.0 to v0.45.0 unseen.
        uses: The-PR-Agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e  # v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NaN is OpenAI-compatible, so LiteLLM reaches it through the OpenAI
          # transport with the base URL swapped. The model id in .pr_agent.toml
          # carries the `openai/` prefix for the same reason; nothing here talks
          # to OpenAI.
          OPENAI__KEY: ${{ secrets.NAN_API_KEY }}
          OPENAI__API_BASE: https://api.nan.builders/v1
          # PR-Agent loads `.pr_agent.toml` from the DEFAULT branch ("No .pr_agent.toml
          # found; using existing settings" on every bootstrap PR, 2026-09-06), so the
          # PR that introduces the file reviews with upstream's gpt-5.6 and NaN rejects
          # the key. The workflow file IS read from the PR head, so the model travels
          # here and the toml keeps every other setting. Env wins over the file in
          # PR-Agent's settings order. The preflight above probes the chain it
          # declares, which a test keeps equal to the toml's, and the draw puts
          # the NaN member it picked first.
          CONFIG__MODEL: ${{ steps.route.outputs.nan_model }}
          CONFIG__FALLBACK_MODELS: ${{ steps.route.outputs.nan_fallbacks }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          # AI-045 AC6 (#1858, #1923): stream every NaN call. Non-streamed, NaN's edge
          # cuts the answer at about 125 s, and a request it holds open sits silent
          # past `ai_timeout`, which bounds the gap between reads rather than the
          # call (run 36826726168: 12 minutes, no retry logged). Streamed, the same
          # timeout measures the gap between chunks. PR-Agent forces streaming only
          # when both halves match: the request's provider and a substring of its
          # base URL. Setting the provider explicitly is what makes the first half
          # true; LiteLLM strips the matching `openai/` prefix from the model id.
          # Here and not in `.pr_agent.toml`, which PR-Agent reads from the default
          # branch, so the PR introducing it would not stream.
          LITELLM__CUSTOM_LLM_PROVIDER: openai
          LITELLM__FORCE_STREAMING_CUSTOM_LLM_PROVIDER: openai
          LITELLM__FORCE_STREAMING_API_BASE_SUBSTRINGS: '["api.nan.builders"]'
          # glm5.3-flash reasons until NaN closes the stream unless its effort is
          # lowered: at its default and at `medium` it spent all 16K output
          # tokens thinking, hit NaN's 60,000-reasoning-character ceiling and
          # returned no review. At `low` it reviewed a 37K-token diff in 285 s
          # and a 97K-token one in 215 s, with half the ceiling to spare
          # (measured 2026-10-08, AI-045 AC9). LiteLLM does not know the model,
          # so PR-Agent sends an effort only to the ids listed here. The effort
          # is one setting for the whole attempt, and deepseek-v4-flash already
          # receives PR-Agent's default (`medium`) because LiteLLM marks it
          # reasoning-capable; it now receives `low`, which it accepts and does
          # not act on (ai/nan/README.md). mimo-v2.6-flash receives none.
          CONFIG__REASONING_EFFORT: low
          CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS: '["glm5.3-flash"]'
          # A timed-out call moves to the next model of the chain instead of
          # retrying the one that just timed out: a NaN model that times out once
          # is usually saturated, and a retry spends the step's 12 minutes on it.
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          # One secret, delivered by name. `dotf secrets sync ci` uploads exactly
          # the entries whose `consumers` list this repo, so the reviewer holds
          # one credential rather than an ambient set — the failure surface stays
          # one key wide. #1025 is the same concern on the spec-review path,
          # where whole-registry injection means one broken item mapping can take
          # down authentication for everything.
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          # The review names the model that wrote it (model, tokens, time, AI
          # calls), so a reader of the comment knows which pool member reviewed
          # without opening the run. Every attempt sets it.
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          # Stated rather than defaulted, so the event lists are visible rather
          # than implied — leaving that implicit is what let the workflow's own
          # trigger list drift away unnoticed (#1053).
          #
          # `synchronize` is deliberately NOT in this list, and adding it would
          # do nothing at all. Upstream routes synchronize down a separate path:
          # "handle_push_trigger = false # when true, handle synchronize events
          # using push_commands". A synchronize in pr_actions is a setting that
          # looks right and asserts nothing — the exact shape this repo has spent
          # two days cataloguing, and it was nearly committed here by hand.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # The push path, which is what actually reviews a new commit.
          github_action_config.handle_push_trigger: "true"
          # `/review -i` when the gate's baseline is one it can vouch for,
          # `/review` (full) otherwise — never anything else: upstream's
          # default is ['/describe', '/review'], so leaving this unsaid would
          # reinstate describe on every push. The push gate above decides
          # whether this step even runs and picks the mode; PR-Agent's own
          # incremental thresholds stay at their defaults and the bound lives
          # in one tested place (TOOL-023).
          #
          # Defaults to the FULL command whenever mode isn't exactly
          # "incremental" — including a gate that produced no output at all
          # (continue-on-error, an unhandled crash). PR-Agent's own baseline
          # pick for `-i` has no author check (get_previous_review matches by
          # body only), so an unreadable or absent verdict falls open to the
          # widest review rather than to an incremental one over a range
          # nothing here vouched for.
          github_action_config.push_commands: >-
            ${{ steps.push_gate.outputs.mode == 'incremental' && '["/review -i"]' || '["/review"]' }}
          # Merge commits and bot pushes are not a human asking for another look.
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          # `describe` REWRITES the PR body. The bodies in this repo carry
          # hand-written measurement tables, merge orders and before/after
          # evidence — the part worth reading — and a model rewriting them
          # destroys exactly that. Turned off as a decision, not left off by
          # accident. With auto_improve also off (#1107), `review` is the only
          # pass that still runs unasked — one inference call per event.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          # OFF, to halve the inference this workflow demands per PR (#1107).
          #
          # NaN allows 5 concurrent requests, shared with pi, qq and hive
          # embeddings. Every PR was spending two of them — one on the review, one
          # on suggestions — and six PRs in one session got no review at all
          # because the pool was exhausted.
          #
          # Suggestions are the half to drop, not the review, and the registry
          # already says why: `## PR Code Suggestions` is deliberately excluded
          # from review_markers because "suggestions are not a review". So the
          # second call could never turn a PR green; it competed with the call
          # that could.
          #
          # The [pr_code_suggestions] config stays and stays tested — `/improve`
          # on demand still behaves. What changes is that it no longer runs
          # unasked on every push.
          github_action_config.auto_improve: "false"
          github_action_config.fail_on_tool_errors: "true"

      - name: Measure whether the NaN attempt published
        id: published_after_nan
        if: >
          !cancelled() && steps.route.outputs.first == 'nan'
            && steps.route.outputs.second == 'anthropic'
            && (github.event_name == 'pull_request'
              || (github.event_name == 'issue_comment'
                  && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: ./scripts/pr-agent-publish-guard.sh --probe --output "$GITHUB_OUTPUT"
      # The Anthropic attempt again, second this time; see its first copy above.
      - name: PR-Agent on Anthropic, after NaN published nothing
        id: pr_agent_anthropic_second
        if: "!cancelled() && steps.published_after_nan.outputs.published == 'false'"
        timeout-minutes: 8
        continue-on-error: true
        uses: The-PR-Agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e  # v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The only inference credential this step holds; NaN's is not here.
          ANTHROPIC__KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
          CONFIG__MODEL: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__MODEL_WEAK: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__NO_TEMPERATURE_MODELS: >-
            ["anthropic/claude-haiku-5-5", "claude-haiku-5-5",
            "anthropic/claude-sonnet-5-5", "claude-sonnet-5-5"]
          CONFIG__ENABLE_CLAUDE_ADAPTIVE_THINKING: "true"
          CONFIG__CLAUDE_ADAPTIVE_THINKING_MODELS_OVERRIDE: '["anthropic/claude-haiku-5-5", "anthropic/claude-sonnet-5-5"]'
          CONFIG__REASONING_EFFORT: ${{ steps.route.outputs.anthropic_effort }}
          CONFIG__AI_TIMEOUT: "360"
          DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS: "32000"
          # Below: identical to the NaN attempt's review settings (a test checks it).
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: >-
            ${{ steps.push_gate.outputs.mode == 'incremental' && '["/review -i"]' || '["/review"]' }}
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.fail_on_tool_errors: "true"
      # A review that did not happen must not report success (#1107). The logic
      # lives in scripts/pr-agent-publish-guard.sh, which the probe above shares,
      # so "published" has one definition; its header records the bindings
      # (author, start stamp, marker from the default branch) and why each exists.
      #
      # `fallback_models` names a second NaN model for CONCURRENCY (per-model
      # limit, measured), never to soften the quality bar.
      - name: Fail if no review was published
        # Only the paths that actually run `/review`. An issue_comment invoking
        # `/describe` or `/improve` legitimately publishes no Guide, and failing
        # those would teach the reader to ignore this check.
        # `always()` would also run this after the credential step failed and stack a
        # wrong NaN-concurrency diagnosis on top of the remedy; skip it in that case.
        # And skip it when the step above found nothing PR-Agent may read: no review
        # was possible, and the NaN diagnosis below would be false (#1618).
        # And skip it when the push gate held a push below its threshold: no review
        # was asked for (TOOL-023).
        # It does run when no declared NaN model answered (AI-045 AC9): the
        # Anthropic attempt may have reviewed, and when it did not, this names why.
        if: >
          always() && steps.credential.outcome != 'failure'
            && steps.reviewable.outcome != 'failure'
            && steps.reviewable.outputs.reviewable != 'false'
            && steps.push_gate.outputs.run != 'false'
            && (github.event_name == 'pull_request'
              || (github.event_name == 'issue_comment'
                  && contains(github.event.comment.body, '/review')))
        env:
          # `github.token`, not `secrets.GITHUB_TOKEN`: identical value, but it is
          # the automatic token rather than a declared repository secret, so the
          # secret allowlist keeps counting what it was written to count.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # The repository's OWN default branch, never `pull_request.base.ref`: the base
          # is chosen by the PR author, and this reads the file that decides what counts
          # as a review. kubelab's port made this call first (its tests pin it).
          BASE_REF: ${{ github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          # Every attempt in execution order, as `<outcome> <model>`; the guard
          # judges the last one that ran.
          ATTEMPTS: |
            ${{ steps.pr_agent_anthropic_first.outcome }} ${{ steps.route.outputs.anthropic_model }}
            ${{ steps.pr_agent.outcome }} ${{ steps.route.outputs.nan_model }}
            ${{ steps.pr_agent_anthropic_second.outcome }} ${{ steps.route.outputs.anthropic_model }}
          ROUTE_NOTE: ${{ steps.route.outputs.note }}
          # A failed draw writes no outputs, so every attempt reads skipped; this
          # tells that apart from a pool where no member answered.
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
        run: ./scripts/pr-agent-publish-guard.sh
