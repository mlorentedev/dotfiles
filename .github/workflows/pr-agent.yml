name: pr-agent

# TOOL-013 (#786): an inline PR reviewer backed by NaN cluster inference, so
# review capacity stops being the constraint on throughput.
#
# The problem it removes, measured 2026-08-16: CodeRabbit's free tier allows
# roughly one review per hour ACCOUNT-WIDE. Three PRs opened by three parallel
# sessions each received "Review limit reached" instead of a review, while
# `gh pr checks` reported `CodeRabbit  pass` for all three. Two were merged
# unreviewed. GUARD-002 made that visible; this makes it stop happening.
#
# Runs ALONGSIDE CodeRabbit deliberately, for a bounded window. #786 requires
# recording which tool found what before either is retired, and the standing rule
# caps autonomous reviewers at two.

on:
  pull_request:
    # `synchronize` is here so a push is reviewed, and it is NOT handled by
    # pr_actions — see handle_push_trigger below. #1053 removed it because the
    # workflow fired and PR-Agent declined to act, publishing a `review: SUCCESS`
    # that read as "the reviewer looked at your new commits" and meant "the
    # action started and did nothing". That finding stands; what changes is which
    # side of it moves.
    #
    # It moves because an enforced doctrine line depended on the behaviour that
    # was removed. `harness/enforced/pr-stewardship.md`, injected into every
    # agent's instructions, says *"pushing a fix reopens it, because the reviewer
    # re-reviews"* — and after #1053 that was false. A reviewer that does not
    # re-review a fix leaves the second half of every PR unread, so the machinery
    # matches the doctrine rather than the doctrine being softened.
    #
    # The rebase burst is already paid for: #1042's concurrency group is keyed on
    # the event name with cancel-in-progress, so push-vs-push still cancels and a
    # burst of three pushes collapses to ONE review of the settled state.
    types: [opened, synchronize, reopened, ready_for_review]
  # Slash commands (/review, /describe, /improve) on an existing PR.
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key, and it is load-bearing. A PR comment is an
  # issue_comment whose `issue.number` IS the PR number, so without it a
  # comment-triggered run shares this group with the in-flight pull_request run and
  # `cancel-in-progress` kills the review. PR-Agent is a Docker action that spends
  # its first ~20s in `Build The-PR-Agent/pr-agent`, and CodeRabbit's auto-summary
  # comment reliably lands inside that window.
  #
  # Measured on #1037 and #1038 (2026-08-18): both reviews cancelled mid-build,
  # both workflows reporting green, zero reviews produced — on every PR since this
  # shipped. Pushes still supersede pushes; a comment no longer cancels a review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the review comments are the product
  issues: write          # slash-command replies land as issue comments

jobs:
  review:
    # issue_comment fires on issues too; and skip draft PRs, which are by
    # definition not asking to be read yet.
    #
    # The issue_comment half is gated on the commenter's association, and that gate
    # is load-bearing rather than defensive. This repository is PUBLIC: any account
    # can comment on a pull request, `issue_comment` runs in the BASE repo context
    # with secrets available, and without this line a stranger typing `/review`
    # spends the inference budget and exercises `pull-requests: write` on demand.
    #
    # The association set is the one the attestation classifier already treats as
    # "belongs to this repository", so membership has one definition here and not two.
    #
    # The release-branch exclusion is HERE, not in `.pr_agent.toml`, and that
    # move is the fix for #1073. The config declared
    # `ignore_pr_source_branches = ["^release-please--"]` and the reviewer went
    # on reviewing release PRs anyway: measured on #1085, whose head ref is
    # `release-please--branches--main` and which carries a `## PR Reviewer Guide`
    # comment posted at 07:36:44. Upstream applies that key on its webhook path;
    # the Action entrypoint takes its settings from the env below, so the line
    # read like a decision and asserted nothing — the same shape as the
    # `synchronize`-in-`pr_actions` trap documented further down.
    #
    # A workflow-level `if` cannot be ignored by the tool it gates. The cost of
    # the old arrangement was not cosmetic: every release PR spent inference
    # budget on a diff that is a mechanical restatement of commits already
    # reviewed when they landed, which is the same reasoning behind the gate's
    # own release-please exemption in harness/review-attestation.json.
    #
    # Only the `pull_request` half is gated. A human typing `/review` on a
    # release PR is asking on purpose, and this must not silently refuse them.
    #
    # This repository is PUBLIC, so the branch name is attacker-chosen: anyone
    # can open a PR from a branch called `release-please--anything` and skip the
    # reviewer. That buys nothing. Skipping the reviewer does not attest a
    # review — `review-attestation` reads `declined`/`pending` and stays red, and
    # the gate's own release exemption is keyed on DIFF SIGNATURE, never on the
    # branch, precisely so a borrowed name cannot satisfy both. Two independent
    # conditions, and this one only ever removes a review; it can never grant one.
    #
    # `head.ref` is read by the expression engine here, never interpolated into a
    # `run:` — the injection concern that normally attaches to it does not apply
    # to an `if`.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false
        && !startsWith(github.event.pull_request.head.ref, 'release-please--')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialise inference repo-wide: QUEUE, never cancel (#1107).
    #
    # This is a SECOND group, at job level, and it does not replace the
    # workflow-level one above — the two answer different questions. The
    # workflow group is per-PR and cancels, so a burst of pushes still collapses
    # to one review of the settled state (#1042). This one is repo-wide and does
    # not cancel, so two PRs never ask NaN for inference at the same time.
    #
    # ADR-032 names the rule: the top tier "queues or escalates, NEVER degrades
    # silently". Queuing is the sanctioned behaviour, and it is what was missing:
    # the cluster's 5 slots were being spent by our own parallel CI, so a review
    # failed rather than waited.
    #
    # It cannot guarantee a free slot — pi, qq and hive draw on the same pool —
    # but it caps this workflow's demand at one, leaving the rest for interactive
    # use instead of racing it.
    concurrency:
      group: pr-agent-nan-inference
      cancel-in-progress: false
    steps:
      # `The-PR-Agent/pr-agent`, not `qodo-ai/pr-agent` as #786's body says: the
      # project has been renamed and the old path now redirects. Pinned to a tag
      # that was verified to exist and to carry an `action.yaml` (a Docker
      # action) — the first draft of this file pinned `@v0.30`, which does not
      # exist at all.
      - name: PR-Agent
        # Pinned by COMMIT, not by tag. A tag is mutable and belongs to upstream:
        # whoever can move `v0.42.0` decides what runs here, and what runs here holds
        # NAN_API_KEY and `pull-requests: write`. This repository is PUBLIC, so that
        # is not a theoretical actor. Resolved from the API rather than copied:
        # `gh api repos/The-PR-Agent/pr-agent/git/ref/tags/v0.42.0`.
        uses: The-PR-Agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa  # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NaN is OpenAI-compatible, so LiteLLM reaches it through the OpenAI
          # transport with the base URL swapped. The model id in .pr_agent.toml
          # carries the `openai/` prefix for the same reason; nothing here talks
          # to OpenAI.
          OPENAI__KEY: ${{ secrets.NAN_API_KEY }}
          OPENAI__API_BASE: https://api.nan.builders/v1
          # One secret, delivered by name. `dotf secrets sync ci` uploads exactly
          # the entries whose `consumers` list this repo, so the reviewer holds
          # one credential rather than an ambient set — the failure surface stays
          # one key wide. #1025 is the same concern on the spec-review path,
          # where whole-registry injection means one broken item mapping can take
          # down authentication for everything.
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          # Stated rather than defaulted, so the event lists are visible rather
          # than implied — leaving that implicit is what let the workflow's own
          # trigger list drift away unnoticed (#1053).
          #
          # `synchronize` is deliberately NOT in this list, and adding it would
          # do nothing at all. Upstream routes synchronize down a separate path:
          # "handle_push_trigger = false # when true, handle synchronize events
          # using push_commands". A synchronize in pr_actions is a setting that
          # looks right and asserts nothing — the exact shape this repo has spent
          # two days cataloguing, and it was nearly committed here by hand.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # The push path, which is what actually reviews a new commit.
          github_action_config.handle_push_trigger: "true"
          # `/review` ONLY, and the omission is the point: upstream's default is
          # ['/describe', '/review'], so enabling the push trigger without saying
          # this would silently reinstate describe on every push and undo the
          # decision recorded below. A default that quietly re-enables a thing
          # you turned off elsewhere is the same defect one layer down.
          github_action_config.push_commands: '["/review"]'
          # Merge commits and bot pushes are not a human asking for another look.
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          # `describe` REWRITES the PR body. The bodies in this repo carry
          # hand-written measurement tables, merge orders and before/after
          # evidence — the part worth reading — and a model rewriting them
          # destroys exactly that. Turned off as a decision, not left off by
          # accident. With auto_improve also off (#1107), `review` is the only
          # pass that still runs unasked — one inference call per event.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          # OFF, to halve the inference this workflow demands per PR (#1107).
          #
          # NaN allows 5 concurrent requests, shared with pi, qq and hive
          # embeddings. Every PR was spending two of them — one on the review, one
          # on suggestions — and six PRs in one session got no review at all
          # because the pool was exhausted.
          #
          # Suggestions are the half to drop, not the review, and the registry
          # already says why: `## PR Code Suggestions` is deliberately excluded
          # from review_markers because "suggestions are not a review". So the
          # second call could never turn a PR green; it competed with the call
          # that could.
          #
          # The [pr_code_suggestions] config stays and stays tested — `/improve`
          # on demand still behaves. What changes is that it no longer runs
          # unasked on every push.
          github_action_config.auto_improve: "false"

      # A review that did not happen must not report success (#1107).
      #
      # PR-Agent swallows a failed inference into a clean exit. Measured on run
      # 32325012314: green job, no review, because the model returned
      # `litellm.RateLimitError: deepseek-v4-flash concurrency limit: max 5
      # simultaneous requests`. Six PRs in one session were affected. ADR-032
      # already forbids it — the top tier "queues or escalates, NEVER degrades
      # silently" — so this makes the degrade loud and does nothing else.
      #
      # `fallback_models` names mimo-v2.5 for CONCURRENCY (per-model limit,
      # measured), never to soften the quality bar. The marker comes from the
      # registry, over the API since this job has no checkout, at the BASE ref
      # since a PR supplying it could redefine it. Presence, not recency:
      # `persistent_comment` edits an existing comment. See #1107.
      - name: Fail if no review was published
        # Only the paths that actually run `/review`. An issue_comment invoking
        # `/describe` or `/improve` legitimately publishes no Guide, and failing
        # those would teach the reader to ignore this check.
        if: >
          always() && (github.event_name == 'pull_request'
            || (github.event_name == 'issue_comment'
                && contains(github.event.comment.body, '/review')))
        env:
          # `github.token`, not `secrets.GITHUB_TOKEN`: identical value, but it is
          # the automatic token rather than a declared repository secret, so the
          # "exactly one secret" guard keeps counting what it was written to count.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          marker=$(gh api "repos/${GITHUB_REPOSITORY}/contents/harness/review-attestation.json?ref=${BASE_REF}" \
            --jq '.content' | base64 -d \
            | jq -r '.reviewers[] | select(.login == "github-actions") | .review_markers[0]')
          if [ -z "$marker" ] || [ "$marker" = "null" ]; then
            echo "::error::no review marker declared for github-actions in harness/review-attestation.json"
            exit 1
          fi
          found=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
          if [ "$found" -gt 0 ]; then
            echo "review published (marker: ${marker})"
            exit 0
          fi
          echo "::error::PR-Agent reported success but published no review (no comment carries \"${marker}\")."
          echo "::error::Most likely cause: NaN concurrency exhaustion — the cluster allows 5 simultaneous"
          echo "::error::requests, shared with pi, qq and hive embeddings. See #1107."
          exit 1
