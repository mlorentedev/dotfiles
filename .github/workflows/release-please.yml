name: release-please

# Conventional-Commit-driven release automation (CLI-011, #369).
# On every push to main, release-please maintains a standing "release PR" that
# computes the next semver from commit types, regenerates CHANGELOG.md, and
# bumps DOTF_VERSION in versions.conf (extra-files). Merging that PR creates the
# v* tag — which cli.yml's `release` job consumes to build + publish binaries.
#
# IMPORTANT: a tag pushed with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub recursion guard), so goreleaser would never fire. We use a
# PAT (RELEASE_TOKEN) so the tag push triggers cli.yml. See spec
# specs/CLI-011-release-please/proposal.md R1.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # CI-005 (#1668): the release PR body must close nothing. The changelog
      # template renders every reference a commit carries as ", closes [#N]",
      # `Refs #N` included, and merging the release PR then closes each one
      # (0.57.0 closed three open issues this way). An issue that should close
      # was already closed by its own PR, so every GitHub closing keyword in
      # this body is rewritten to "refs". release-please regenerates the body on
      # each push, so this runs on each push too. CHANGELOG.md keeps its wording:
      # only a PR body or a commit message closes anything.
      # Guarded by tests/release-pr-body-refs.bats, which runs this script.
      - name: Neutralise closing keywords in the release PR body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keyword='(close[sd]?|fix(e[sd])?|resolve[sd]?)'
          reference='\[?(([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+|https://github\.com/[^[:space:]]+/issues/[0-9]+)'
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(any(.labels[]; .name == "autorelease: pending")) | .number' |
            while read -r pr; do
              gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .body >"$RUNNER_TEMP/body.md"
              sed -E "s~\\b${keyword}:?([[:space:]]+${reference})~refs\\3~gI" \
                "$RUNNER_TEMP/body.md" >"$RUNNER_TEMP/body.new"
              if ! cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/body.new"; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F "body=@$RUNNER_TEMP/body.new" >/dev/null
                echo "release PR #$pr: closing keywords rewritten to refs"
              fi
            done
